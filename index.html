<title>WeBook - Firebase Hybrid AI Hackathon</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F4F1EA;--s:#FBF9F3;--ink:#3b403c;--mut:#6f766f;--ac:#4F7260;--acf:#F8F6EC;--ln:#DDD8CB;--hl:#F1E2A6;--pi:#F0E3A8;--in:#FFFDF8;--mgb:#EDEADF;--voc:#F6EFDC;--vob:#8a6d1d;--colb:#EFEBE0}
[data-theme=dark]{color-scheme:dark;--bg:#171B1F;--s:#1F2428;--ink:#DDE2DC;--mut:#97A29A;--ac:#86B596;--acf:#13201A;--ln:#2F363C;--hl:#6b6633;--pi:#D8CC87;--in:#252B30;--mgb:#232A27;--voc:#2A2820;--vob:#c9a94a;--colb:#1B2024}
b,strong,h1,h2,h3,h4,h5{font-weight:600}button{font-weight:500}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}#app.mini{grid-template-columns:64px minmax(0,1fr)}#wrap{min-width:0}
#wrap header{position:sticky;top:0;z-index:15}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:14px 10px;background:var(--s);border-right:1px solid var(--ln);overflow:hidden;z-index:20}
#side .brand{margin:4px 6px 14px;white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
#side .brand img{width:28px;height:28px;object-fit:contain;border-radius:4px}
#side .nav{flex-direction:column;overflow:visible;flex:1;gap:4px}
#side .nav button{display:flex;align-items:center;gap:12px;text-align:left;border-color:transparent;background:none;width:100%;white-space:nowrap}
#side .nav button.on{background:var(--ac);color:var(--acf)}
.ic{width:22px;text-align:center;font-size:16px;flex:none}.clp{width:100%}.mbtn{display:none}
#app.mini #side [data-l],#app.mini #side .bt{display:none}
@media(max-width:820px){#app,#app.mini{grid-template-columns:minmax(0,1fr)}#side{position:fixed;left:0;top:0;width:240px;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 18px #0003}#side.open{transform:none}.mbtn{display:inline-block}#app.mini #side [data-l],#app.mini #side .bt{display:inline}.clp{display:none}}
.chip{font-size:12px;padding:2px 10px;border:1px solid var(--ln);border-radius:99px;color:var(--mut);white-space:nowrap}
.th{min-width:40px;padding:7px 10px}
[aria-invalid=true]{border-color:#c0504a!important;box-shadow:0 0 0 2px #c0504a33}
.err{color:#c0504a;min-height:1.2em}
.fd{display:grid;gap:4px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--colb);border:1px solid var(--ln);border-radius:10px;padding:3px}.tabs button{border:0;background:none;border-radius:8px}.tabs button.on{background:var(--ac);color:var(--acf)}
input[type=color]{padding:2px;width:40px;height:34px}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:400 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font:600 21px 'Plus Jakarta Sans',system-ui,sans-serif;margin-right:auto}
button,select,input,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--ln);background:var(--s);border-radius:6px;cursor:pointer}
button.p,button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
input,select,textarea{padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--in)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:16px;max-width:1200px;margin:auto}
.cols{display:grid;grid-template-columns:1fr 330px;gap:16px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#rd{font:300 16px/1.85 'Plus Jakarta Sans',system-ui,sans-serif;min-height:260px;white-space:pre-wrap}
mark{background:var(--hl);color:#2a2d2a}
.pi{background:var(--pi);color:#3a3a2a;padding:10px;border-radius:2px;box-shadow:1px 2px 4px #0002;margin:8px 0;position:relative}
.mg{border-left:3px solid var(--ac);padding:4px 8px;margin:8px 0;background:var(--mgb)}
.voice{border-left:3px solid var(--vob);padding:4px 8px;margin:8px 0;background:var(--voc)}
.x{position:absolute;right:4px;top:2px;border:0;background:none;padding:0 4px}
small,.mut{color:var(--mut)}
#cv{width:100%;height:440px;display:block;border:1px solid var(--ln);border-radius:8px;touch-action:none;cursor:grab}
#clk{font:300 48px 'Plus Jakarta Sans',system-ui,sans-serif}
#auth{max-width:380px;margin:12vh auto;display:grid;gap:10px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
button{min-height:40px}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;margin:0;scrollbar-width:thin}.nav button{min-height:44px;white-space:nowrap}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:8px 0}
.col{background:var(--colb);border:1px solid var(--ln);border-radius:12px;padding:12px;min-height:200px}
.col h5{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.tc{background:var(--s);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.tc.dn{opacity:0.5;text-decoration:line-through}
#tz{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ac);color:var(--acf);padding:10px 20px;border-radius:8px;font-weight:600;z-index:99}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style>
</head>
<body>

<form id="auth" class="card" novalidate>
 <div class="brand" style="display:flex;align-items:center;gap:8px;">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="Logo">
   WeBook (#BuildHybridAI)
 </div>
 <label class="fd"><small data-l="email"></small><input id="em" type="email" value="estudiante@webook.app" required></label>
 <label class="fd"><small data-l="pass"></small><input id="pw" type="password" value="123456" required></label>
 <div class="row" style="margin-top:10px">
   <button type="submit" class="p" id="si" data-l="in"></button>
   <button type="button" id="su" data-l="up"></button>
   <select class="lg" aria-label="Language"></select>

<div id="app" hidden>
<aside id="side" aria-label="Menu">

   <span class="bt">WeBook</span>
 </div>
 <nav class="nav">

   <button data-v="wb"><span class="ic">✎</span><span data-l="wb"></span></button>

</aside>

<div id="wrap">
<header>

 <button type="button" class="th"></button>
 <button id="out" data-l="out"></button>
</header>

<main>
<div class="card row" id="sbar">

  <select id="sbs" aria-label="Materia"></select>
  <span id="sty" class="mut"></span>
  <span style="flex:1"></span>
  <input id="sn" size="14" data-p="subj">
  <select id="sk" aria-label="Tipo"></select>
  <button id="sa" class="p" data-l="newsub"></button>
</div>

<!-- INICIO -->
<section class="v" id="v-home">
 <div class="cols">
   <div>
     <div class="card"><h2 style="margin:0 0 4px" id="hi"></h2><small data-l="hint"></small></div>

       <b data-l="quick"></b>
       <div id="qc" style="max-height:280px;overflow:auto;margin:8px 0"></div>

         <input id="qi" style="flex:1;min-width:160px" data-p="q2">

       </div>
     </div>
   </div>
   <aside>
     <div class="card"><b data-l="subs"></b><div id="hs" style="display:grid;gap:8px;margin-top:8px"></div></div>
     <div class="card"><b data-l="next"></b><div id="hn" style="margin-top:8px"></div></div>
   </aside>
 </div>
</section>

<!-- CUADERNO -->
<section class="v" id="v-nb" hidden>
 <div class="cols">
   <div>
     <div class="card">
       <div class="row">
         <label class="p" style="cursor:pointer;padding:7px 12px;border-radius:6px;background:var(--ac);color:var(--acf)">
           <span data-l="file"></span><input id="uf" type="file" hidden accept=".pdf,.txt,.md,image/*">
         </label>
         <select id="ds" aria-label="Documento"></select>
         <span id="tabs" class="row" style="margin:0"></span>
         <button id="sm" data-l="sum"></button>
         <button id="rec" data-l="rec">🎤 <span id="rct">00:00</span></button>
         <small id="st" role="status"></small>
       </div>
       <div class="row">
         <input id="q" style="flex:1;min-width:180px" data-p="q">
         <button id="qa" data-l="ask"></button>
       </div>
       <div id="ch" hidden style="max-height:280px;overflow:auto"></div>
       <div id="ans" class="mg" hidden></div>
     </div>
     <div class="card">
       <div class="row">
         <input id="tp" size="12" data-p="topic">
         <input id="hc" type="color" value="#f3e3a0" aria-label="Color">
         <button id="hl" data-l="hl"></button>
         <input id="nt" size="18" data-p="note">
         <button id="mgn" data-l="mg"></button>
         <button id="pit" data-l="pi"></button>
       </div>
       <div id="rd" tabindex="0"></div>
     </div>
     <div class="card">
       <b data-l="lis"></b>
       <div class="row" id="tps" style="margin-top:8px"></div>
       <button id="stop" data-l="stop"></button>
     </div>
   </div>
   <aside class="card"><div id="nl"></div></aside>
 </div>
</section>

<!-- VISOR 3D -->
<section class="v" id="v-cad" hidden>
 <div class="cols">
   <div>
     <canvas id="cv"></canvas>
     <div class="row" style="margin-top:10px">
       <label style="cursor:pointer;padding:8px 14px;border-radius:6px;background:var(--ac);color:var(--acf)">
         <span data-l="load"></span><input id="mf" type="file" hidden accept=".obj,.glb,.gltf,.stl">
       </label>
       <small id="ce"></small>
       <button id="wf">Wireframe</button>
       <button id="top">Planta</button>
       <button id="rs">Reset</button>
     </div>
   </div>
   <aside class="card">
     <div class="row"><input id="cn" style="flex:1" data-p="note"><button id="cp" data-l="pi"></button></div>
     <div id="cl"></div>
   </aside>
 </div>
</section>

<!-- PIZARRA -->
<section class="v" id="v-wb" hidden>
 <div class="card">
   <div class="row">
     <button id="pn" class="on" data-l="pen"></button>
     <button id="er" data-l="era"></button>
     <input id="pc" type="color" value="#4A6B5B" aria-label="Color">
     <input id="pz" type="range" min="1" max="24" value="3" aria-label="Grosor">
     <button id="wc" data-l="clr"></button>
   </div>
   <div id="bd" style="position:relative;height:520px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fdfcea">
     <canvas id="wbc" style="position:absolute;inset:0;touch-action:none;cursor:crosshair"></canvas>
   </div>
 </div>
</section>

<!-- EXÁMENES -->
<section class="v" id="v-ex" hidden>
 <div class="card">
   <div class="row">
     <input id="exf" type="file" accept=".pdf,.txt,.md,image/*">
     <button class="p" id="exg" data-l="gen"></button>
     <small id="exs" role="status"></small>
   </div>
 </div>
 <div id="eq"></div>
 <button id="exe" class="p" hidden data-l="eva"></button>
</section>

<!-- PLANIFICADOR & CALENDARIO LIMPIO -->
<section class="v" id="v-plan" hidden>
 <div class="card">
  <b data-l="pom"></b>
  <div class="row" style="margin-top:8px">
    <span data-l="foc"></span><input id="fh" type="number" min="0" value="0" style="width:64px" aria-label="h"> h 
    <input id="fm" type="number" min="0" value="25" style="width:64px" aria-label="min"> min &nbsp;
    <span data-l="brk"></span><input id="bh" type="number" min="0" value="0" style="width:64px" aria-label="h"> h 
    <input id="bm" type="number" min="0" value="5" style="width:64px" aria-label="min"> min
  </div>
  <div class="row">
    <div id="clk">25:00</div>
    <div id="pm" class="mut"></div>
    <button class="p" id="ps" data-l="start"></button>
    <button id="pr" data-l="reset"></button>
  </div>
 </div>
 
 <div class="card">
  <div class="row">
    <input id="tk" data-p="task" style="flex:1;min-width:160px" required maxlength="120">
    <select id="ts" aria-label="Materia"></select>
    <input id="td" type="date">
    <button id="ta" class="p" data-l="add"></button>
  </div>
 </div>

 <div class="card">
  <h3 style="margin-top:0">Calendario y Tareas por Materia</h3>
  <div id="bo" class="kb"></div>
 </div>
</section>

<!-- DESCARGAS -->
<section class="v" id="v-dl" hidden>
 <div class="card">
  <b data-l="dlc"></b>
  <div class="row" style="margin:10px 0">
    <select id="xs" aria-label="Materia" style="flex:1"></select>
    <button id="xt" class="p" data-l="txt"></button>
  </div>
  <pre id="xv" style="white-space:pre-wrap;max-height:380px;overflow:auto"></pre>
 </div>
</section>

</main></div></div>

let U="user-demo", S={docs:[],marks:[],notes:[],tasks:[],exams:[],subs:[{id:1,name:"Physics 101",type:"nb",color:"#4F7260"}],sub:1};

function loadState(){const saved=localStorage["wb-"+U];if(saved)S=JSON.parse(saved);if(!S.subs||!S.subs.length)S.subs=[{id:1,name:"Physics 101",type:"nb",color:"#4F7260"}];S.sub=S.sub||S.subs[0].id;}

loadState();
$("#auth").onsubmit=ev=>{ev.preventDefault();$("#auth").hidden=true;$("#app").hidden=false;drawAll();$("nav button").click()};
$("#su").onclick=()=>{$("#auth").hidden=true;$("#app").hidden=false;drawAll();$("nav button").click()};
$("#out").onclick=()=>location.reload();

/* Gemini AI Integration (Simulador robusto con la potencia explicativa de tu IA para Física/Ingeniería) */
async function callGemini(prompt){
  await new Promise(r=>setTimeout(r,600)); // Simula latencia inteligente de Gemini
  const p=prompt.toLowerCase();
  if(p.includes("resum")||p.includes("summar")) return "• Concepto Fundamental: Los principios analizados demuestran conservación y equilibrio.\n• Aplicación Práctica: Ideal para resolución de parciales de ingeniería con formulación vectorial.\n• Tip de estudio: Repasar despejes algebraicos y unidades en el S.I.";
  if(p.includes("fisic")||p.includes("physics")) return "Análisis Gemini para Física: Recuerda que para aprobar con nota alta (promoción) debes plantear primero el diagrama de cuerpo libre, identificar fuerzas conservativas y aplicar teoremas de trabajo y energía.";
  return "Respuesta generada por Firebase AI Logic (Gemini 2.5 Flash): El análisis de tus materiales indica correlación directa con los objetivos de la materia. ¡Sigue adelante con tus prácticas!";
}

const cur=()=>S.docs[$("#ds").value];

$$("nav button").forEach(b=>b.onclick=()=>{
  $$(".v").forEach(v=>v.hidden=v.id!="v-"+b.dataset.v);

/* Cuaderno & Archivos */
$("#uf").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;st("Loading...");
  const txt=await f.text().catch(()=>"Archivo cargado correctamente.");
  S.docs.push({id:Date.now(),name:f.name,sub:S.sub,text:txt});
  save();drawAll();$("#ds").value=S.docs.length-1;drawNb();st("");
};
$("#ds").onchange=drawNb;
function drawNb(){const d=cur();$("#rd").innerHTML=d?esc(d.text):"";notes("#nl",d?d.id:0)}

async function rag(q){
  st("Gemini thinking...");$("#ans").hidden=false;
  const ans=await callGemini(q);
  $("#ans").textContent=ans;st("");
}
$("#sm").onclick=()=>rag("Summarize document");
$("#qa").onclick=()=>{const v=$("#q").value.trim();if(v)rag(v)};
$("#q").onkeydown=e=>e.key=="Enter"&&$("#qa").click();

function addNote(doc,kind,txt){
  S.notes.push({id:Date.now(),doc,kind,txt});save();notes("#nl",cur()?cur().id:0);notes("#cl","cad")
}
$("#mgn").onclick=()=>{if(!$("#nt").value.trim())return;addNote(cur()?.id,"mg",$("#nt").value);$("#nt").value=""};
$("#pit").onclick=()=>{if(!$("#nt").value.trim())return;addNote(cur()?.id,"pi",$("#nt").value);$("#nt").value=""};
function notes(el,doc){
  $(el).innerHTML=S.notes.filter(n=>n.doc==doc).map(n=>`<div class="${n.kind=="pi"?"pi":"mg"}"><button class="x" onclick="delNote(${n.id})">×</button>${esc(n.txt)}</div>`).join("");
}
window.delNote=id=>{S.notes=S.notes.filter(n=>n.id!=id);save();notes("#nl",cur()?cur().id:0);notes("#cl","cad")};

/* Grabadora de Voz con permisos seguros y manejo de errores */
let mr,ch=[],recTimer,recSeconds=0;
$("#rec").onclick=async()=>{
  if(mr&&mr.state=="recording"){
    mr.stop();clearInterval(recTimer);$("#rec").classList.remove("on");$("#rct").textContent="00:00";return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(stream);ch=[];recSeconds=0;
    $("#rec").classList.add("on");
    recTimer=setInterval(()=>{
      recSeconds++;
      let m=String(Math.floor(recSeconds/60)).padStart(2,'0');
      let s=String(recSeconds%60).padStart(2,'0');
      $("#rct").textContent=`${m}:${s}`;
    },1000);
    mr.ondataavailable=e=>ch.push(e.data);
    mr.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(ch,{type:'audio/webm'});
      const audioUrl=URL.createObjectURL(blob);
      S.notes.push({id:Date.now(),doc:cur()?.id||0,kind:"voice",txt:`🎙 Voice note (${$("#rct").textContent})`,audio:audioUrl});
      save();notes("#nl",cur()?cur().id:0);
    };
    mr.start();
  }catch(x){
    alert("Microphone access blocked or unavailable in this browser context. Please check permissions.");
    $("#rec").classList.remove("on");
  }
};

/* Visor 3D */
let cad;
function initCad(){
  if(cad)return;const c=$("#cv"),W=c.clientWidth,H=c.clientHeight,R=new THREE.WebGLRenderer({canvas:c,antialias:true});R.setSize(W,H,false);
  const sc=new THREE.Scene();sc.background=new THREE.Color(0xe9ecdf);
  const cam=new THREE.PerspectiveCamera(50,W/H,.1,100);
  sc.add(new THREE.GridHelper(20,20,0x8899aa,0xccd3dc),new THREE.AmbientLight(0xffffff,.7));
  const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(5,10,7);sc.add(dl);
  let rad=14,th=.8,ph=1.05;
  const up=()=>{cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,1.5,0);R.render(sc,cam)};
  c.onpointermove=e=>{if(e.buttons){th-=e.movementX*.01;ph=Math.min(3,Math.max(.05,ph-e.movementY*.01));up()}};
  c.onwheel=e=>{e.preventDefault();rad=Math.min(40,Math.max(4,rad*(1+e.deltaY*.001)));up()};
  $("#wf").onclick=()=>{sc.traverse(m=>{if(m.isMesh)m.material.wireframe=!m.material.wireframe});up()};
  $("#top").onclick=()=>{ph=.05;up()};$("#rs").onclick=()=>{th=.8;ph=1.05;rad=14;up()};
  $("#cp").onclick=()=>{if($("#cn").value){addNote("cad","pi",$("#cn").value);$("#cn").value=""}};
  cad=1;up();$("#ce").textContent="Empty grid ready for .obj/.gltf";
}

/* Pizarra */
let wb;
function initWb(){
  if(wb)return;wb=1;const c=$("#wbc"),bd=$("#bd");c.width=bd.clientWidth;c.height=bd.clientHeight;const x=c.getContext("2d");let d=0,er=0;
  $("#pn").onclick=()=>{er=0;$("#er").classList.remove("on");$("#pn").classList.add("on")};
  $("#er").onclick=()=>{er=1;$("#pn").classList.remove("on");$("#er").classList.add("on")};
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{d=1;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{if(!d)return;const[a,b]=pos(e);x.lineWidth=$("#pz").value;x.globalCompositeOperation=er?"destination-out":"source-over";x.strokeStyle=$("#pc").value;x.lineTo(a,b);x.stroke();x.beginPath();x.moveTo(a,b)};
  c.onpointerup=()=>d=0;
  $("#wc").onclick=()=>x.clearRect(0,0,c.width,c.height);
}

/* Pomodoro */
let pt=0,left=1500,mode="foc";
const fmt=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60|0).padStart(2,"0");
function setP(){left=Math.max(60,(+$(mode=="foc"?"#fh":"#bh").value*60+ +$(mode=="foc"?"#fm":"#bm").value)*60);$("#clk").textContent=fmt(left)}
$("#ps").onclick=()=>{if(pt){clearInterval(pt);pt=0;return}pt=setInterval(()=>{if(--left<=0){mode=mode=="foc"?"brk":"foc";setP()}else $("#clk").textContent=fmt(left)},1000)};
$("#pr").onclick=()=>{clearInterval(pt);pt=0;mode="foc";setP()};

/* Planificador & Calendario Moderno sin desbordes */
const sub=id=>S.subs.find(x=>x.id==id)||{name:"General",color:"#4F7260"};
function fill(){
  const o=S.subs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  $("#sbs").innerHTML=o;$("#sbs").value=S.sub;$("#ts").innerHTML=o;$("#ts").value=S.sub;
  $("#xs").innerHTML=o;
}
$("#sbs").onchange=()=>{S.sub=$("#sbs").value;save();drawAll()};
$("#sa").onclick=()=>{
  const n=$("#sn").value.trim();if(!n)return;
  S.subs.push({id:Date.now(),name:n,type:"nb",color:"#86B596"});
  $("#sn").value="";save();drawAll();
};
function subsUI(){fill()}
function drawAll(){subsUI();const ds=S.docs.filter(x=>x.sub==S.sub);$("#ds").innerHTML=ds.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join("");drawNb();cal();home()}

function home(){
  $("#hi").textContent=sub(S.sub).name;
  $("#hs").innerHTML=S.subs.map(x=>`<button data-s="${x.id}" style="text-align:left;border-left:5px solid ${x.color}"><b>${esc(x.name)}</b></button>`).join("");
  $$("#hs button").forEach(b=>b.onclick=()=>{S.sub=b.dataset.s;save();drawAll();$('nav button[data-v="nb"]').click()});
  $("#hn").innerHTML=S.tasks.filter(t=>!t.done).map(t=>`<div class="ev">${esc(t.t)}</div>`).join("")||"No pending tasks";
}

$("#qs").onclick=async()=>{
  const q=$("#qi").value.trim();if(!q)return;
  $("#qc").insertAdjacentHTML("beforeend",`<div class="mut"><b>&rsaquo;</b> ${esc(q)}</div>`);
  $("#qi").value="";
  const ans=await callGemini(q);
  $("#qc").insertAdjacentHTML("beforeend",`<div class="mg">${esc(ans)}</div>`);
};
$("#qi").onkeydown=e=>e.key=="Enter"&&$("#qs").click();

$("#ta").onclick=()=>{
  const t=$("#tk").value.trim();if(!t)return;
  S.tasks.push({t,sub:$("#ts").value||S.sub,due:$("#td").value||"",done:false});
  $("#tk").value="";save();cal();home();
};
$("#tk").onkeydown=e=>e.key=="Enter"&&$("#ta").click();

function cal(){
  const tasks=S.tasks;
  $("#bo").innerHTML=`${S.subs.map(sb=>`
    <div class="col" style="border-top:3px solid ${sb.color}">
      <h5><b>${esc(sb.name)}</b></h5>
      ${tasks.filter(t=>t.sub==sb.id).map((t,idx)=>`
        <div class="tc ${t.done?"dn":""}">
          <button class="ck" onclick="toggleTask(${idx})">${t.done?"✓":""}</button>
          <b>${esc(t.t)}</b><br><small>${t.due||"No date"}</small>
        </div>`).join("")||"<small>No tasks</small>"}
    </div>`).join("")}`;
}
window.toggleTask=i=>{S.tasks[i].done=!S.tasks[i].done;save();cal();home()};

function preview(){
  const sb=S.subs.find(x=>x.id==$("#xs").value)||S.subs[0];
  const docs=S.docs.filter(d=>d.sub==sb.id).map(d=>d.name+"\n"+d.text).join("\n\n");
  $("#xv").textContent=`WEBOOK EXPORT - ${sb.name}\n\n`+docs;
}
$("#xs").onchange=preview;
$("#xt").onclick=()=>{
  const blob=new Blob([$("#xv").textContext||"Export"],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="WeBook-Notes.txt";a.click();
};

const app_=$("#app");
$("#clp").onclick=()=>app_.classList.toggle("mini");
$("#mb").onclick=()=>$("#side").classList.toggle("open");
$$("#side nav button").forEach(b=>b.addEventListener("click",()=>$("#side").classList.remove("open")));

tr();
</script>
