<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
try{document.documentElement.dataset.theme=localStorage.wbt||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}
</script>
<title>WeBook - #BuildHybridAI Hackathon</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F4F1EA;--s:#FBF9F3;--ink:#3b403c;--mut:#6f766f;--ac:#4F7260;--acf:#F8F6EC;--ln:#DDD8CB;--hl:#F1E2A6;--pi:#F0E3A8;--in:#FFFDF8;--mgb:#EDEADF;--colb:#EFEBE0}
[data-theme=dark]{color-scheme:dark;--bg:#171B1F;--s:#1F2428;--ink:#DDE2DC;--mut:#97A29A;--ac:#86B596;--acf:#13201A;--ln:#2F363C;--hl:#6b6633;--pi:#D8CC87;--in:#252B30;--mgb:#232A27;--colb:#1B2024}
b,strong,h1,h2,h3,h4,h5{font-weight:600}button{font-weight:500}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}#wrap{min-width:0}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:14px 10px;background:var(--s);border-right:1px solid var(--ln);z-index:20}
#side .brand{margin:4px 6px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
#side .brand img{width:28px;height:28px;object-fit:contain;border-radius:4px}
#side .nav{display:flex;flex-direction:column;gap:4px;flex:1}
#side .nav button{display:flex;align-items:center;gap:12px;text-align:left;border-color:transparent;background:none;width:100%}
#side .nav button.on{background:var(--ac);color:var(--acf)}
.ic{width:22px;text-align:center;font-size:16px;flex:none}
header{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font:600 21px 'Plus Jakarta Sans',system-ui,sans-serif;margin-right:auto}
button,select,input,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--ln);background:var(--s);border-radius:6px;cursor:pointer}
button.p,button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
input,select,textarea{padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--in)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:16px;max-width:1200px;margin:auto}
.cols{display:grid;grid-template-columns:1fr 330px;gap:16px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#rd{font:300 16px/1.85 'Plus Jakarta Sans',system-ui,sans-serif;min-height:220px;white-space:pre-wrap}
.mg{border-left:3px solid var(--ac);padding:6px 10px;margin:8px 0;background:var(--mgb);border-radius:4px}
.x{position:absolute;right:6px;top:4px;border:0;background:none;padding:0 4px}
small,.mut{color:var(--mut)}
#clk{font:300 48px 'Plus Jakarta Sans',system-ui,sans-serif}
#auth{max-width:380px;margin:12vh auto;display:grid;gap:10px}
.fd{display:grid;gap:4px}
@media(max-width:820px){.cols{grid-template-columns:1fr}#app{grid-template-columns:1fr}#side{display:none}}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:8px 0}
.col{background:var(--colb);border:1px solid var(--ln);border-radius:12px;padding:12px;min-height:180px}
.col h5{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.tc{position:relative;background:var(--s);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.tc.dn{opacity:0.5;text-decoration:line-through}
</style>
</head>
<body>

<form id="auth" class="card" novalidate>
 <div class="brand" style="display:flex;align-items:center;gap:8px;">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="Logo">
   WeBook
 </div>
 <label class="fd"><small data-l="email"></small><input id="em" type="email" data-p="email_p" required></label>
 <label class="fd"><small data-l="pass"></small><input id="pw" type="password" data-p="pass_p" required></label>
 <div class="row" style="margin-top:10px">
   <button type="submit" class="p" data-l="in"></button>
   <select class="lg" aria-label="Language"></select>
   <button type="button" class="th" aria-label="Theme">☾</button>
 </div>
</form>

<div id="app" hidden>
<aside id="side" aria-label="Menu">
 <div class="brand">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="Logo">
   <span>WeBook</span>
 </div>
 <nav class="nav">
   <button data-v="home" class="on"><span class="ic">⌂</span><span data-l="home"></span></button>
   <button data-v="nb"><span class="ic">❏</span><span data-l="nb"></span></button>
   <button data-v="plans2d"><span class="ic">◈</span><span data-l="plans2d"></span></button>
   <button data-v="wb"><span class="ic">✎</span><span data-l="wb"></span></button>
   <button data-v="ex"><span class="ic">✦</span><span data-l="ex"></span></button>
   <button data-v="plan"><span class="ic">▦</span><span data-l="plan"></span></button>
   <button data-v="dl"><span class="ic">⇩</span><span data-l="dl"></span></button>
 </nav>
</aside>

<div id="wrap">
<header>
 <span class="brand" data-l="app_title"></span>
 <span class="mut" style="font-size:12px" data-l="ai_status"></span>
 <select class="lg" aria-label="Language"></select>
 <button type="button" class="th" aria-label="Theme">☾</button>
 <button id="out" data-l="out"></button>
</header>

<main>
<div class="card row" id="sbar">
  <b data-l="subj"></b>
  <select id="sbs" aria-label="Subject"></select>
  <span style="flex:1"></span>
  <input id="sn" size="18" data-p="newsub_p">
  <button id="sa" class="p" data-l="newsub"></button>
</div>

<!-- INICIO -->
<section class="v" id="v-home">
 <div class="cols">
   <div>
     <div class="card"><h2 style="margin:0 0 4px" id="hi"></h2><small data-l="hint"></small></div>
     <div class="card">
       <b data-l="quick"></b>
       <div id="qc" style="max-height:240px;overflow:auto;margin:8px 0"></div>
       <div class="row">
         <input id="qi" style="flex:1" data-p="q_p">
         <button id="qs" class="p" data-l="ask"></button>
       </div>
     </div>
   </div>
   <aside>
     <div class="card"><b data-l="subs"></b><div id="hs" style="display:grid;gap:8px;margin-top:8px"></div></div>
     <div class="card"><b data-l="next"></b><div id="hn" style="margin-top:8px"></div></div>
   </aside>
 </div>
</section>

<!-- CUADERNO -->
<section class="v" id="v-nb" hidden>
 <div class="cols">
   <div>
     <div class="card">
       <div class="row">
         <label class="p" style="cursor:pointer;padding:7px 12px;border-radius:6px;background:var(--ac);color:var(--acf)">
           <span data-l="file"></span><input id="uf" type="file" hidden accept=".pdf,.txt,.md">
         </label>
         <select id="ds" aria-label="Document"></select>
         <button id="sm" class="p" data-l="sum"></button>
         <button id="rec"><span data-l="rec"></span> <span id="rct">00:00</span></button>
         <small id="st" role="status"></small>
       </div>
       <div class="row">
         <input id="q" style="flex:1" data-p="qdoc_p">
         <button id="qa" class="p" data-l="ask_doc"></button>
       </div>
       <div id="ans" class="mg" hidden></div>
     </div>
     <div class="card">
       <div class="row">
         <input id="nt" size="25" data-p="note_p">
         <button id="mgn" class="p" data-l="add_note"></button>
       </div>
       <div id="rd" tabindex="0"></div>
     </div>
   </div>
   <aside class="card"><b data-l="notes_feed"></b><div id="nl"></div></aside>
 </div>
</section>

<!-- ESQUEMAS Y PLANOS 2D -->
<section class="v" id="v-plans2d" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="plans2d"></h3>
   <p class="mut" data-l="plans2d_desc"></p>
   <div class="row">
     <label class="p" style="cursor:pointer;padding:7px 12px;border-radius:6px;background:var(--ac);color:var(--acf)">
       <span data-l="upload_plan"></span><input id="mf" type="file" hidden accept="image/*,.pdf">
     </label>
   </div>
   <div id="plan-viewer" style="min-height:300px;border:1px solid var(--ln);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--in);padding:12px">
     <span class="mut" data-l="no_plan"></span>
   </div>
 </div>
</section>

<!-- PIZARRA -->
<section class="v" id="v-wb" hidden>
 <div class="card">
   <div class="row">
     <button id="pn" class="on" data-l="pen"></button>
     <button id="er" data-l="era"></button>
     <input id="pc" type="color" value="#4A6B5B" aria-label="Color">
     <input id="pz" type="range" min="1" max="20" value="3" aria-label="Size">
     <label class="p" style="cursor:pointer;padding:7px 12px;border-radius:6px;background:var(--ac);color:var(--acf)">
       <span data-l="up_img"></span><input id="img-upload" type="file" hidden accept="image/*">
     </label>
     <button id="wc" data-l="clr"></button>
   </div>
   <div id="bd" style="position:relative;height:480px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fdfcea">
     <canvas id="wbc" style="position:absolute;inset:0;touch-action:none;cursor:crosshair"></canvas>
   </div>
 </div>
</section>

<!-- EXÁMENES -->
<section class="v" id="v-ex" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="ex"></h3>
   <p class="mut" data-l="ex_desc"></p>
   <div class="row">
     <input id="exf" type="file" accept=".pdf,.txt,.md" multiple>
     <button class="p" id="exg" data-l="gen"></button>
     <small id="exs" role="status"></small>
   </div>
 </div>
 <div id="eq"></div>
</section>

<!-- PLANIFICADOR & POMODORO -->
<section class="v" id="v-plan" hidden>
 <div class="card">
  <b data-l="pom"></b>
  <div class="row" style="margin-top:8px">
    <span data-l="foc"></span><input id="fm" type="number" min="1" value="25" style="width:70px">
    <span data-l="brk"></span><input id="bm" type="number" min="1" value="5" style="width:70px">
  </div>
  <div class="row">
    <div id="clk">25:00</div>
    <button class="p" id="ps" data-l="start"></button>
    <button id="pr" data-l="reset"></button>
  </div>
 </div>

 <div class="card">
  <div class="row">
    <input id="tk" data-p="task_p" style="flex:1">
    <select id="ts" aria-label="Subject"></select>
    <input id="td" type="date">
    <button id="ta" class="p" data-l="add"></button>
  </div>
 </div>

 <div class="card">
  <h3 style="margin-top:0" data-l="deadlines_title"></h3>
  <div id="bo" class="kb"></div>
 </div>
</section>

<!-- DESCARGAS -->
<section class="v" id="v-dl" hidden>
 <div class="card">
  <b data-l="dlc"></b>
  <div class="row" style="margin:10px 0">
    <select id="xs" style="flex:1"></select>
    <button id="xt" class="p" data-l="txt"></button>
  </div>
  <pre id="xv" style="white-space:pre-wrap;max-height:360px;overflow:auto;background:var(--in);padding:10px;border-radius:6px"></pre>
 </div>
</section>

</main></div></div>

    gen:"Generate practice exam",pom:"Pomodoro Timer",foc:"Focus (min):",brk:"Break (min):",

    plans2d_desc:"Sube un esquema o imagen en 2D para revisarlo junto a tus apuntes.",
    upload_plan:"Subir imagen 2D",no_plan:"Aún no cargaste ningún esquema 2D.",pen:"Lápiz",era:"Borrador",
    up_img:"Subir imagen",clr:"Limpiar",ex_desc:"Sube modelos de examen anteriores para generar preguntas nuevas con explicación paso a paso.",
    gen:"Generar simulacro",pom:"Temporizador Pomodoro",foc:"Estudio (min):",brk:"Descanso (min):",

    newsub:"Criar matéria",newsub_p:"Nome da matéria...",hint:"Crie ou selecione uma matéria acima para começar do zero.",
    quick:"Assistente de Estudo com IA",q_p:"Digite uma dúvida de estudo...",ask:"Perguntar",subs:"Matérias",next:"Prazos",

    ask_doc:"Consultar arquivo",note_p:"Escreva uma nota...",add_note:"Adicionar nota",notes_feed:"Notas e Áudio",
    plans2d_desc:"Envie um esquema ou imagem 2D para revisar junto às suas anotações.",
    upload_plan:"Enviar imagem 2D",no_plan:"Nenhum esquema 2D carregado ainda.",pen:"Caneta",era:"Borracha",
    up_img:"Enviar imagem",clr:"Limpar",ex_desc:"Envie provas anteriores para gerar novas questões com explicação passo a passo.",
    gen:"Gerar simulado",pom:"Temporizador Pomodoro",foc:"Foco (min):",brk:"Pausa (min):",
    start:"Iniciar / Pausar",reset:"Reiniciar",task_p:"Tarefa ou data de prova...",add:"Adicionar",
    deadlines_title:"Prazos por Matéria",dlc:"Exportar Anotações",txt:"Baixar TXT",
    no_sub:"Nenhuma matéria selecionada",no_subs_empty:"Nenhuma matéria ainda. Crie uma acima.",no_tasks:"Nenhum prazo pendente.",

  },
  fr:{

    app_title:"WeBook",ai_status:"IA Gemini Prête",home:"Accueil",nb:"Cahier",plans2d:"Schémas 2D",
    wb:"Tableau",ex:"Simulateur d'Examens",plan:"Planificateur et Pomodoro",dl:"Téléchargements",subj:"Matière :",
    newsub:"Créer matière",newsub_p:"Nom de la matière...",hint:"Créez ou sélectionnez une matière ci-dessus pour repartir de zéro.",

    ask_doc:"Interroger fichier",note_p:"Écrire une note...",add_note:"Ajouter note",notes_feed:"Notes et Audio",

  }
};

let L=localStorage.wbl||"en";
const t=k=>(DICT[L]&&DICT[L][k])||DICT.en[k]||k;

function applyLang(){
  document.documentElement.lang=L;
  $$("[data-l]").forEach(el=>{el.textContent=t(el.dataset.l)});
  $$("[data-p]").forEach(el=>{el.placeholder=t(el.dataset.p)});
  $$(".lg").forEach(s=>{s.value=L});
  if(!$("#app").hidden)drawAll();
}

$$(".lg").forEach(s=>{
  s.innerHTML=LG.map(code=>`<option value="${code}">${LN[code]}</option>`).join("");
  s.value=L;
  s.onchange=()=>{L=s.value;localStorage.wbl=L;applyLang()};
});

$$(".th").forEach(b=>{
  b.onclick=()=>{
    const next=document.documentElement.dataset.theme=="dark"?"light":"dark";
    document.documentElement.dataset.theme=next;
    try{localStorage.wbt=next}catch{}
    $$(".th").forEach(x=>x.textContent=next=="dark"?"☀":"☾");
  };
  b.textContent=document.documentElement.dataset.theme=="dark"?"☀":"☾";
});

/* Estado limpio para usuario nuevo */
let S={docs:[],notes:[],tasks:[],subs:[],sub:null};
const save=()=>{try{localStorage["webook-clean"]=JSON.stringify(S)}catch{}};
try{const raw=localStorage["webook-clean"];if(raw)S=JSON.parse(raw)}catch{}

$$("#side nav button").forEach(b=>b.onclick=()=>{
  $$(".v").forEach(v=>v.hidden=v.id!="v-"+b.dataset.v);
  $$("#side nav button").forEach(x=>x.classList.toggle("on",x==b));
  if(b.dataset.v=="wb")initWb();
  if(b.dataset.v=="dl")preview();
  if(b.dataset.v=="home")home();
});

function subsUI(){
  const opts=`<option value="">${esc(t("no_sub"))}</option>`+S.subs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  $("#sbs").innerHTML=opts;$("#sbs").value=S.sub||"";
  $("#ts").innerHTML=opts;$("#ts").value=S.sub||"";
  $("#xs").innerHTML=opts;$("#xs").value=S.sub||"";
}

$("#sbs").onchange=()=>{S.sub=$("#sbs").value||null;save();drawAll()};
$("#sa").onclick=()=>{
  const n=$("#sn").value.trim();if(!n)return;
  const item={id:String(Date.now()),name:n,color:"#4F7260"};
  S.subs.push(item);S.sub=item.id;$("#sn").value="";save();drawAll();
};

function drawAll(){
  subsUI();
  const ds=S.docs.filter(x=>x.sub==S.sub);
  $("#ds").innerHTML=ds.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join("");
  drawNb();cal();home();
}

function home(){
  const sb=S.subs.find(x=>x.id==S.sub);
  $("#hi").textContent=sb?sb.name:"WeBook";
  $("#hs").innerHTML=S.subs.length
    ? S.subs.map(x=>`<div class="card" style="border-left:4px solid ${x.color};margin:0;padding:8px"><b>${esc(x.name)}</b></div>`).join("")
    : `<small class="mut">${esc(t("no_subs_empty"))}</small>`;
  $("#hn").innerHTML=S.tasks.filter(x=>!x.done).length
    ? S.tasks.filter(x=>!x.done).map(x=>`<div class="tc"><b>${esc(x.t)}</b><br><small>${esc(x.due||"—")}</small></div>`).join("")
    : `<small class="mut">${esc(t("no_tasks"))}</small>`;
}

async function askModel(question){
  await new Promise(r=>setTimeout(r,350));
  const activeSub=S.subs.find(x=>x.id==S.sub);
  const subLabel=activeSub?` [${activeSub.name}]`:"";
  return `${t("ai_reply")}${subLabel}\n• ${question}`;
}

$("#qs").onclick=async()=>{
  const q=$("#qi").value.trim();if(!q)return;
  $("#qc").insertAdjacentHTML("beforeend",`<div class="mut"><b>&rsaquo;</b> ${esc(q)}</div>`);
  $("#qi").value="";
  const ans=await askModel(q);
  $("#qc").insertAdjacentHTML("beforeend",`<div class="mg" style="white-space:pre-wrap">${esc(ans)}</div>`);
};
$("#qi").onkeydown=e=>e.key=="Enter"&&$("#qs").click();

const cur=()=>S.docs[$("#ds").value];
$("#uf").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const text=await f.text().catch(()=>"");
  S.docs.push({id:String(Date.now()),name:f.name,sub:S.sub,text});
  save();drawAll();$("#ds").value=S.docs.length-1;drawNb();
};
$("#ds").onchange=drawNb;
function drawNb(){const d=cur();$("#rd").textContent=d?(d.text||d.name):"";notes("#nl",d?d.id:null)}

$("#sm").onclick=async()=>{const d=cur();if(!d)return;$("#ans").hidden=false;$("#ans").textContent=await askModel(d.name)};
$("#qa").onclick=async()=>{const q=$("#q").value.trim();if(!q)return;$("#ans").hidden=false;$("#ans").textContent=await askModel(q)};

function addNote(kind,txt){S.notes.push({id:String(Date.now()),doc:cur()?.id||null,kind,txt});save();notes("#nl",cur()?cur().id:null)}
$("#mgn").onclick=()=>{if(!$("#nt").value.trim())return;addNote("mg",$("#nt").value);$("#nt").value=""};
function notes(el,doc){
  $(el).innerHTML=S.notes.filter(n=>n.doc==doc).map(n=>`<div class="mg" style="position:relative"><button class="x" onclick="delN('${n.id}')">×</button>${esc(n.txt)}</div>`).join("");
}
window.delN=id=>{S.notes=S.notes.filter(n=>n.id!=id);save();notes("#nl",cur()?cur().id:null)};

let mr,recT,sec=0;
$("#rec").onclick=async()=>{
  if(mr&&mr.state=="recording"){mr.stop();clearInterval(recT);$("#rec").classList.remove("on");$("#rct").textContent="00:00";return}
  try{
    const strm=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(strm);let chunks=[];sec=0;$("#rec").classList.add("on");
    recT=setInterval(()=>{sec++;$("#rct").textContent=String(sec/60|0).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{
      strm.getTracks().forEach(tr=>tr.stop());
      addNote("voice",`${t("rec")} (${$("#rct").textContent})`);
    };
    mr.start();
  }catch{
    $("#rec").classList.remove("on");
    $("#st").textContent=t("rec");
  }
};

$("#mf").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  $("#plan-viewer").innerHTML=`<img src="${url}" alt="${esc(f.name)}" style="max-width:100%;max-height:420px;border-radius:6px">`;
};

let wb;
function initWb(){
  if(wb)return;wb=1;const c=$("#wbc"),bd=$("#bd");c.width=bd.clientWidth;c.height=bd.clientHeight;const x=c.getContext("2d");let d=0,er=0;
  $("#pn").onclick=()=>{er=0;$("#er").classList.remove("on");$("#pn").classList.add("on")};
  $("#er").onclick=()=>{er=1;$("#pn").classList.remove("on");$("#er").classList.add("on")};
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{d=1;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{if(!d)return;const[a,b]=pos(e);x.lineWidth=$("#pz").value;x.globalCompositeOperation=er?"destination-out":"source-over";x.strokeStyle=$("#pc").value;x.lineTo(a,b);x.stroke();x.beginPath();x.moveTo(a,b)};
  c.onpointerup=()=>d=0;
  $("#wc").onclick=()=>x.clearRect(0,0,c.width,c.height);
  $("#img-upload").onchange=e=>{
    const f=e.target.files[0];if(!f)return;const img=new Image();
    img.onload=()=>x.drawImage(img,20,20,Math.min(img.width,320),Math.min(img.height,240));
    img.src=URL.createObjectURL(f);
  };
}

$("#exg").onclick=()=>{
  const files=[...($("#exf").files||[])];
  $("#exs").textContent=files.length?files.map(f=>f.name).join(", "):"";
  $("#eq").innerHTML=`<div class="card"><p><b>1.</b> ${esc(t("gen"))}</p><textarea rows="3" style="width:100%"></textarea></div>`;
};

let pt=0,left=1500;
$("#ps").onclick=()=>{
  if(pt){clearInterval(pt);pt=0;return}
  pt=setInterval(()=>{if(--left<=0){clearInterval(pt);pt=0;left=(+($("#fm").value||25))*60}$("#clk").textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0")},1000);
};
$("#pr").onclick=()=>{clearInterval(pt);pt=0;left=(+($("#fm").value||25))*60;$("#clk").textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0")};

$("#ta").onclick=()=>{
  const title=$("#tk").value.trim();if(!title)return;
  S.tasks.push({t:title,sub:$("#ts").value||S.sub,due:$("#td").value||"",done:false});
  $("#tk").value="";save();cal();home();
};

function cal(){
  $("#bo").innerHTML=S.subs.map(sb=>`
    <div class="col" style="border-top:3px solid ${sb.color}">
      <h5><b>${esc(sb.name)}</b></h5>
      ${S.tasks.filter(x=>x.sub==sb.id).map((x,idx)=>`
        <div class="tc ${x.done?"dn":""}">
          <input type="checkbox" ${x.done?"checked":""} onchange="toggleT(${idx})">
          <b>${esc(x.t)}</b><br><small>${esc(x.due||"—")}</small>
        </div>`).join("")||`<small class="mut">${esc(t("no_tasks"))}</small>`}
    </div>`).join("");
}
window.toggleT=i=>{S.tasks[i].done=!S.tasks[i].done;save();cal();home()};

function preview(){
  const sb=S.subs.find(x=>x.id==$("#xs").value);
  if(!sb){$("#xv").textContent="";return}
  const docs=S.docs.filter(d=>d.sub==sb.id).map(d=>`${d.name}\n${d.text||""}`).join("\n\n");
  $("#xv").textContent=`${sb.name}\n\n${docs}`;
}
$("#xs").onchange=preview;
$("#xt").onclick=()=>{
  const blob=new Blob([$("#xv").textContent||""],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="webook-export.txt";a.click();
};

$("#auth").onsubmit=e=>{e.preventDefault();$("#auth").hidden=true;$("#app").hidden=false;drawAll()};
$("#out").onclick=()=>{$("#app").hidden=true;$("#auth").hidden=false};

applyLang();
</script>
</body>
</html>
