<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
try{document.documentElement.dataset.theme=localStorage.wbt||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}
</script>
<title>WeBook</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F4F1EA;--s:#FBF9F3;--ink:#3b403c;--mut:#6f766f;--ac:#4F7260;--acf:#F8F6EC;--ln:#DDD8CB;--hl:#F1E2A6;--pi:#F5E59B;--in:#FFFDF8;--mgb:#EDEADF;--colb:#EFEBE0}
[data-theme=dark]{color-scheme:dark;--bg:#171B1F;--s:#1F2428;--ink:#DDE2DC;--mut:#97A29A;--ac:#86B596;--acf:#13201A;--ln:#2F363C;--hl:#6b6633;--pi:#D8CC87;--in:#252B30;--mgb:#232A27;--colb:#1B2024}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
b,strong,h1,h2,h3,h4,h5{font-weight:600}button{font-weight:500}
button,select,input,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--ln);background:var(--s);border-radius:6px;cursor:pointer;min-height:38px}
button.p,button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
input,select,textarea{padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--in)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
small,.mut{color:var(--mut)}

#auth{max-width:380px;margin:10vh auto;display:grid;gap:10px}
.fd{display:grid;gap:4px}

#app{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}
#wrap{min-width:0}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:14px 10px;background:var(--s);border-right:1px solid var(--ln)}
#side .brand{margin:4px 6px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
#side .brand img{width:28px;height:28px;object-fit:contain;border-radius:4px}
#side .nav{display:flex;flex-direction:column;gap:4px;flex:1}
#side .nav button{display:flex;align-items:center;gap:10px;text-align:left;border-color:transparent;background:none;width:100%}
#side .nav button.on{background:var(--ac);color:var(--acf)}
.ic{width:20px;text-align:center;flex:none}

header{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font:600 20px 'Plus Jakarta Sans',system-ui,sans-serif;margin-right:auto}
main{padding:16px;max-width:1200px;margin:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn-label{cursor:pointer;padding:7px 12px;border-radius:6px;background:var(--ac);color:var(--acf);display:inline-flex;align-items:center;min-height:38px;font-weight:500}

#rd{font:300 15px/1.75 'Plus Jakarta Sans',system-ui,sans-serif;min-height:180px;max-height:360px;overflow:auto;white-space:pre-wrap;background:var(--in);padding:12px;border:1px solid var(--ln);border-radius:6px}
.mg{position:relative;border-left:3px solid var(--ac);padding:8px 26px 8px 10px;margin:8px 0;background:var(--mgb);border-radius:4px;white-space:pre-wrap}
.pi{position:relative;background:var(--pi);color:#2f2e22;padding:10px 26px 10px 12px;border-radius:4px;box-shadow:0 2px 6px #0002;margin:8px 0;white-space:pre-wrap}
.voice-card{position:relative;border-left:3px solid #8a6d1d;padding:8px 26px 8px 10px;margin:8px 0;background:var(--mgb);border-radius:4px}
.voice-title{font-weight:600;border:0;background:transparent;padding:2px 4px;border-bottom:1px dashed var(--ln);width:100%;max-width:210px;margin-bottom:4px}
.x{position:absolute;right:6px;top:4px;border:0;background:none;padding:2px 6px;min-height:auto;color:inherit}

#clk{font:300 44px 'Plus Jakarta Sans',system-ui,sans-serif}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:8px 0}
.col{background:var(--colb);border:1px solid var(--ln);border-radius:10px;padding:12px;min-height:160px}
.col h5{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.tc{background:var(--s);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:8px;padding:9px;margin-bottom:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.tc.urgent{border-left-color:#b84a39}
.tc.dn{opacity:.55;text-decoration:line-through}

@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ln)}
  #side .nav{flex-direction:row;overflow-x:auto}
}
</style>
</head>
<body>

<form id="auth" class="card" novalidate>
 <div class="brand" style="display:flex;align-items:center;gap:8px;">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="WeBook">
   WeBook
 </div>
 <label class="fd"><small data-l="email"></small><input id="em" type="email" data-p="email_p" required></label>
 <label class="fd"><small data-l="pass"></small><input id="pw" type="password" data-p="pass_p" required></label>
 <div class="row" style="margin-top:8px">
   <button type="submit" class="p" data-l="in"></button>
   <select class="lg" aria-label="Language"></select>
   <button type="button" class="th" aria-label="Theme">☾</button>
 </div>
</form>

<div id="app" hidden>
<aside id="side" aria-label="Menu">
 <div class="brand">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="WeBook">
   <span>WeBook</span>
 </div>
 <nav class="nav">
   <button data-v="home" class="on"><span class="ic">⌂</span><span data-l="home"></span></button>
   <button data-v="nb"><span class="ic">❏</span><span data-l="nb"></span></button>
   <button data-v="plans2d"><span class="ic">◈</span><span data-l="plans2d"></span></button>
   <button data-v="wb"><span class="ic">✎</span><span data-l="wb"></span></button>
   <button data-v="ex"><span class="ic">✦</span><span data-l="ex"></span></button>
   <button data-v="plan"><span class="ic">▦</span><span data-l="plan"></span></button>
   <button data-v="dl"><span class="ic">⇩</span><span data-l="dl"></span></button>
 </nav>
</aside>

<div id="wrap">
<header>
 <span class="brand" data-l="app_title"></span>
 <span class="mut" style="font-size:12px" data-l="ai_status"></span>
 <select class="lg" aria-label="Language"></select>
 <button type="button" class="th" aria-label="Theme">☾</button>
 <button id="out" data-l="out"></button>
</header>

<main>
<div class="card row" id="sbar">
  <b data-l="subj"></b>
  <select id="sbs" aria-label="Subject"></select>
  <span style="flex:1"></span>
  <input id="sn" size="18" autocomplete="off" data-p="newsub_p">
  <button id="sa" class="p" data-l="newsub"></button>
</div>

<!-- INICIO -->
<section class="v" id="v-home">
 <div class="cols">
   <div>
     <div class="card"><h2 style="margin:0 0 4px" id="hi"></h2><small data-l="hint"></small></div>
     <div class="card">
       <b data-l="quick"></b>
       <div id="qc" style="max-height:260px;overflow:auto;margin:8px 0"></div>
       <div class="row">
         <input id="qi" style="flex:1" autocomplete="off" data-p="q_p">
         <button id="qs" class="p" data-l="ask"></button>
       </div>
     </div>
   </div>
   <aside>
     <div class="card"><b data-l="subs"></b><div id="hs" style="display:grid;gap:8px;margin-top:8px"></div></div>
     <div class="card"><b data-l="next"></b><div id="hn" style="margin-top:8px"></div></div>
   </aside>
 </div>
</section>

<!-- CUADERNO -->
<section class="v" id="v-nb" hidden>
 <div class="cols">
   <div>
     <div class="card">
       <div class="row">
         <label class="btn-label">
           <span data-l="file"></span><input id="uf" type="file" hidden accept=".pdf,.txt,.md">
         </label>
         <select id="ds" aria-label="Document"></select>
         <button id="sm" class="p" data-l="sum"></button>
         <button id="rec" type="button"><span data-l="rec"></span> <span id="rct">00:00</span></button>
         <small id="st" role="status"></small>
       </div>
       <div class="row">
         <input id="q" style="flex:1" autocomplete="off" data-p="qdoc_p">
         <button id="qa" class="p" data-l="ask_doc"></button>
       </div>
       <div id="ans" class="mg" hidden></div>
     </div>

     <div class="card">
       <div class="row">
         <input id="nt" size="24" autocomplete="off" data-p="note_p">
         <button id="mgn" type="button" data-l="add_note"></button>
         <button id="pit" type="button" class="p" data-l="add_postit"></button>
       </div>
       <div id="rd" tabindex="0"></div>
     </div>
   </div>

   <aside class="card">
     <b data-l="notes_feed"></b>
     <div id="nl" style="margin-top:8px"></div>
   </aside>
 </div>
</section>

<!-- ESQUEMAS 2D -->
<section class="v" id="v-plans2d" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="plans2d"></h3>
   <p class="mut" data-l="plans2d_desc"></p>
   <div class="row">
     <label class="btn-label">
       <span data-l="upload_plan"></span><input id="mf" type="file" hidden accept="image/*,.pdf">
     </label>
     <small id="plan-status" class="mut"></small>
   </div>
   <div id="plan-viewer" style="min-height:280px;border:1px solid var(--ln);border-radius:8px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:var(--in);padding:14px">
     <span class="mut" data-l="no_plan"></span>
   </div>
 </div>
</section>

<!-- PIZARRA -->
<section class="v" id="v-wb" hidden>
 <div class="card">
   <div class="row">
     <button id="pn" type="button" class="on" data-l="pen"></button>
     <button id="er" type="button" data-l="era"></button>
     <input id="pc" type="color" value="#4A6B5B" aria-label="Color">
     <input id="pz" type="range" min="1" max="20" value="3" aria-label="Size">
     <button id="wb-postit" type="button" data-l="board_postit"></button>
     <input id="wb-txt-in" size="16" autocomplete="off" data-p="board_txt_p">
     <button id="wb-txt-btn" type="button" data-l="board_txt_btn"></button>
     <label class="btn-label">
       <span data-l="up_img"></span><input id="img-upload" type="file" hidden accept="image/*">
     </label>
     <button id="wc" type="button" data-l="clr"></button>
     <small id="wb-status" class="mut"></small>
   </div>
   <div id="bd" style="position:relative;height:480px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fdfcea">
     <canvas id="wbc" style="position:absolute;inset:0;touch-action:none;cursor:crosshair;z-index:1"></canvas>
   </div>
 </div>
</section>

<!-- SIMULADOR DE EXÁMENES -->
<section class="v" id="v-ex" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="ex"></h3>
   <p class="mut" data-l="ex_desc"></p>
   <div class="row">
     <input id="exf" type="file" accept=".pdf,.txt,.md" multiple>
     <button class="p" id="exg" type="button" data-l="gen"></button>
     <small id="exs" role="status"></small>
   </div>
 </div>
 <div id="eq"></div>
</section>

<!-- PLANIFICADOR, CALENDARIO POR FECHAS & POMODORO -->
<section class="v" id="v-plan" hidden>
 <div class="card">
  <b data-l="pom"></b>
  <div class="row" style="margin-top:8px">
    <span data-l="foc"></span><input id="fm" type="number" min="1" value="25" style="width:70px">
    <span data-l="brk"></span><input id="bm" type="number" min="1" value="5" style="width:70px">
  </div>
  <div class="row">
    <div id="clk">25:00</div>
    <button class="p" id="ps" type="button" data-l="start"></button>
    <button id="pr" type="button" data-l="reset"></button>
  </div>
 </div>

 <div class="card">
  <div class="row">
    <input id="tk" autocomplete="off" data-p="task_p" style="flex:1">
    <select id="ts" aria-label="Subject"></select>
    <input id="td" type="date">
    <button id="ta" type="button" class="p" data-l="add"></button>
  </div>
 </div>

 <div class="card">
  <h3 style="margin-top:0" data-l="deadlines_title"></h3>
  <div id="bo" class="kb"></div>
 </div>
</section>

<!-- DESCARGAS -->
<section class="v" id="v-dl" hidden>
 <div class="card">
  <b data-l="dlc"></b>
  <div class="row" style="margin:10px 0">
    <select id="xs" style="flex:1"></select>
    <button id="xt" type="button" class="p" data-l="txt"></button>
  </div>
  <pre id="xv" style="white-space:pre-wrap;max-height:360px;overflow:auto;background:var(--in);padding:10px;border-radius:6px"></pre>
 </div>
</section>

</main></div></div>

function applyLang(){
  document.documentElement.lang=L;
  $$("[data-l]").forEach(el=>{el.textContent=t(el.dataset.l)});
  $$("[data-p]").forEach(el=>{el.placeholder=t(el.dataset.p)});
  $$(".lg").forEach(s=>{s.value=L});
  if(!$("#app").hidden)drawAll();
}

$$(".lg").forEach(s=>{
  s.innerHTML=LG.map(code=>`<option value="${code}">${LN[code]}</option>`).join("");
  s.value=L;
  s.onchange=()=>{L=s.value;localStorage.wbl=L;applyLang()};
});

$$(".th").forEach(b=>{
  b.onclick=()=>{
    const next=document.documentElement.dataset.theme=="dark"?"light":"dark";
    document.documentElement.dataset.theme=next;
    try{localStorage.wbt=next}catch{}
    $$(".th").forEach(x=>x.textContent=next=="dark"?"☀":"☾");
  };
  b.textContent=document.documentElement.dataset.theme=="dark"?"☀":"☾";
});

let S={docs:[],notes:[],tasks:[],subs:[],sub:null,plans:[]};
const save=()=>{try{localStorage["webook-v3"]=JSON.stringify(S)}catch{}};
try{const raw=localStorage["webook-v3"];if(raw)S={...S,...JSON.parse(raw)}}catch{}

$$("#side nav button").forEach(b=>b.onclick=()=>{
  $$(".v").forEach(v=>v.hidden=v.id!="v-"+b.dataset.v);
  $$("#side nav button").forEach(x=>x.classList.toggle("on",x==b));
  if(b.dataset.v=="wb")initWb();
  if(b.dataset.v=="plans2d")drawPlans2D();
  if(b.dataset.v=="dl")preview();
  if(b.dataset.v=="home")home();
});

function subsUI(){
  const opts=`<option value="">${esc(t("no_sub"))}</option>`+S.subs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  $("#sbs").innerHTML=opts;$("#sbs").value=S.sub||"";
  $("#ts").innerHTML=opts;$("#ts").value=S.sub||"";
  $("#xs").innerHTML=opts;$("#xs").value=S.sub||"";
}

$("#sbs").onchange=()=>{S.sub=$("#sbs").value||null;save();drawAll()};
$("#sa").onclick=()=>{
  const n=$("#sn").value.trim();if(!n)return;
  const item={id:String(Date.now()),name:n,color:"#4F7260"};
  S.subs.push(item);S.sub=item.id;$("#sn").value="";save();drawAll();
};

function drawAll(){
  subsUI();
  const ds=S.docs.filter(x=>x.sub==S.sub);
  $("#ds").innerHTML=ds.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join("");
  drawNb();cal();home();
}

function home(){
  const sb=S.subs.find(x=>x.id==S.sub);
  $("#hi").textContent=sb?sb.name:"WeBook";
  $("#hs").innerHTML=S.subs.length
    ? S.subs.map(x=>`<div class="card" style="border-left:4px solid ${x.color};margin:0;padding:8px"><b>${esc(x.name)}</b></div>`).join("")
    : `<small class="mut">${esc(t("no_subs_empty"))}</small>`;
  const pending=[...S.tasks].filter(x=>!x.done).sort((a,b)=>(a.due||"9999-99-99").localeCompare(b.due||"9999-99-99"));
  $("#hn").innerHTML=pending.length
    ? pending.map(x=>`<div class="tc"><div><b>${esc(x.t)}</b><br><small>${esc(x.due||"—")}</small></div></div>`).join("")
    : `<small class="mut">${esc(t("no_tasks"))}</small>`;
}

function buildSmartReply(question, doc){
  const q=question.trim();
  const ql=q.toLowerCase();
  const sb=S.subs.find(x=>x.id==S.sub);
  const ctx=doc?`${doc.name}${sb?" ("+sb.name+")":""}`:(sb?sb.name:"WeBook");

  if(ql.includes("vector")){
    return `• Concepto (${ctx}): Un vector tiene módulo, dirección y sentido, y se expresa por componentes en el plano o el espacio.\n• Claves para estudiar: norma o módulo, suma y resta componente a componente, producto escalar y producto vectorial.`;
  }
  if(ql.includes("matriz")||ql.includes("matrices")||ql.includes("determinante")){
    return `• Concepto (${ctx}): Una matriz ordena elementos en filas y columnas para representar sistemas o transformaciones.\n• Claves para estudiar: operaciones elementales, rango, inversa y determinante.`;
  }
  if(ql.includes("resum")||ql.includes("summar")){
    return `• Resumen de estudio (${ctx}):\n1. Identifica las definiciones centrales y teoremas principales del material.\n2. Revisa las condiciones o hipótesis antes de aplicar una fórmula.\n3. Resuelve 2 o 3 ejercicios modelo explicando cada paso.`;
  }
  return `• Análisis sobre "${q}" en ${ctx}:\n1. Define el concepto central y sus variables o notación.\n2. Revisa las propiedades o fórmulas asociadas en tu material.\n3. Comprueba el resultado con un ejemplo práctico.`;
}

$("#qs").onclick=()=>{
  const q=$("#qi").value.trim();if(!q)return;
  $("#qc").insertAdjacentHTML("beforeend",`<div class="mut"><b>&rsaquo;</b> ${esc(q)}</div>`);
  $("#qi").value="";
  const reply=buildSmartReply(q,cur());
  $("#qc").insertAdjacentHTML("beforeend",`<div class="mg">${esc(reply)}</div>`);
  $("#qc").scrollTop=$("#qc").scrollHeight;
  $("#qi").focus();
};
$("#qi").onkeydown=e=>e.key=="Enter"&&$("#qs").click();

const cur=()=>S.docs[$("#ds").value];

$("#uf").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const isPdf=f.name.toLowerCase().endsWith(".pdf")||f.type==="application/pdf";
  const text=isPdf?`[${f.name}]\n${t("pdf_loaded")}`:await f.text().catch(()=>f.name);
  S.docs.push({id:String(Date.now()),name:f.name,sub:S.sub,text});
  save();drawAll();$("#ds").value=S.docs.filter(x=>x.sub==S.sub).length-1;drawNb();
};
$("#ds").onchange=drawNb;

function drawNb(){
  const d=cur();
  $("#rd").textContent=d?d.text:"";
  notes("#nl",d?d.id:null);
}

$("#sm").onclick=()=>{
  const d=cur();if(!d)return;
  $("#ans").hidden=false;
  $("#ans").textContent=buildSmartReply("resumen de "+d.name,d);
};

$("#qa").onclick=()=>{
  const q=$("#q").value.trim();if(!q)return;
  $("#ans").hidden=false;
  $("#ans").textContent=buildSmartReply(q,cur());
  $("#q").focus();
};
$("#q").onkeydown=e=>e.key=="Enter"&&$("#qa").click();

function fmtDur(s){
  const n=Math.max(0,Math.floor(s));
  return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
}

function addNote(kind,txt){
  const v=txt.trim();if(!v)return;
  S.notes.push({id:String(Date.now()),doc:cur()?.id||null,kind,txt:v});
  save();notes("#nl",cur()?.id||null);
}
$("#mgn").onclick=()=>{addNote("mg",$("#nt").value);$("#nt").value="";$("#nt").focus()};
$("#pit").onclick=()=>{addNote("pi",$("#nt").value);$("#nt").value="";$("#nt").focus()};
$("#nt").onkeydown=e=>e.key=="Enter"&&$("#mgn").click();

function notes(el,doc){
  const list=S.notes.filter(n=>n.doc==doc);
  $(el).innerHTML=list.map(n=>{
    if(n.kind==="voice"){
      return `
        <div class="voice-card">
          <button type="button" class="x" onclick="delN('${n.id}')">×</button>
          <input class="voice-title" value="${esc(n.title||"Audio")}" onchange="renameVoice('${n.id}',this.value)">
          <small class="mut">(${esc(n.duration||"00:00")})</small>
          ${n.audioUrl?`<audio controls src="${n.audioUrl}" style="width:100%;height:32px;margin-top:6px"></audio>`:`<div class="mut"><small>${esc(n.duration||"00:00")}</small></div>`}
        </div>`;
    }
    return `<div class="${n.kind=="pi"?"pi":"mg"}"><button type="button" class="x" onclick="delN('${n.id}')">×</button>${esc(n.txt)}</div>`;
  }).join("");
}
window.delN=id=>{S.notes=S.notes.filter(n=>n.id!=id);save();notes("#nl",cur()?.id||null)};
window.renameVoice=(id,val)=>{const item=S.notes.find(n=>n.id==id);if(item){item.title=val.trim()||"Audio";save()}};

let mr,recT,sec=0,recStart=0;
$("#rec").onclick=async()=>{
  if(mr&&mr.state=="recording"){mr.stop();return}
  try{
    const strm=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(strm);
    let chunks=[];
    sec=0;recStart=Date.now();
    $("#st").textContent="";
    $("#rec").classList.add("on");
    $("#rct").textContent="00:00";
    recT=setInterval(()=>{sec++;$("#rct").textContent=fmtDur(sec)},1000);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{
      clearInterval(recT);
      strm.getTracks().forEach(tr=>tr.stop());
      const elapsed=Math.max(1,Math.round((Date.now()-recStart)/1000));
      const durStr=fmtDur(Math.max(sec,elapsed));
      const blob=chunks.length?new Blob(chunks,{type:mr.mimeType||"audio/webm"}):null;
      const audioUrl=blob?URL.createObjectURL(blob):"";
      const idx=S.notes.filter(n=>n.kind==="voice").length+1;
      S.notes.push({id:String(Date.now()),doc:cur()?.id||null,kind:"voice",title:`Audio ${idx}`,duration:durStr,audioUrl});
      save();notes("#nl",cur()?.id||null);
      $("#rec").classList.remove("on");
      $("#rct").textContent="00:00";
    };
    mr.start();
  }catch{
    clearInterval(recT);
    $("#rec").classList.remove("on");
    $("#rct").textContent="00:00";
    $("#st").textContent="Mic unavailable";
  }
};

$("#mf").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    S.plans.push({id:String(Date.now()),name:f.name,sub:S.sub,src:reader.result,isImg:f.type.startsWith("image/")});
    save();drawPlans2D();

  reader.readAsDataURL(f);
};

  const list=S.plans.filter(p=>!S.sub||p.sub==S.sub);

    $("#plan-viewer").innerHTML=`<span class="mut">${esc(t("no_plan"))}</span>`;
    return;
  }
  $("#plan-viewer").innerHTML=list.map(p=>`
    <div style="width:100%;border:1px solid var(--ln);border-radius:6px;padding:10px;background:var(--s)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b>${esc(p.name)}</b>
        <button type="button" class="x" style="position:static" onclick="delPlan('${p.id}')">×</button>
      </div>
      ${p.isImg?`<img src="${p.src}" alt="${esc(p.name)}" style="max-width:100%;max-height:360px;border-radius:4px;display:block">`:`<small class="mut">${esc(p.name)}</small>`}
    </div>`).join("");
}
window.delPlan=id=>{S.plans=S.plans.filter(p=>p.id!=id);save();drawPlans2D()};

function makeDraggable(el, container){
  let active=false, ox=0, oy=0;
  el.onpointerdown=e=>{
    if(e.target.closest(".x")||e.target.isContentEditable)return;
    active=true;
    const rect=container.getBoundingClientRect();
    ox=e.clientX-rect.left-el.offsetLeft;
    oy=e.clientY-rect.top-el.offsetTop;
    el.setPointerCapture(e.pointerId);
    el.style.cursor="grabbing";
  };
  el.onpointermove=e=>{
    if(!active)return;
    const rect=container.getBoundingClientRect();
    const nx=Math.max(0,Math.min(rect.width-el.offsetWidth,e.clientX-rect.left-ox));
    const ny=Math.max(0,Math.min(rect.height-el.offsetHeight,e.clientY-rect.top-oy));
    el.style.left=nx+"px";
    el.style.top=ny+"px";
  };
  el.onpointerup=()=>{active=false;el.style.cursor="grab"};
}

let wb;
function initWb(){
  if(wb)return;wb=1;
  const c=$("#wbc"),bd=$("#bd");
  c.width=bd.clientWidth;c.height=bd.clientHeight;
  const x=c.getContext("2d");let d=0,er=0;

  $("#pn").onclick=()=>{er=0;$("#er").classList.remove("on");$("#pn").classList.add("on")};
  $("#er").onclick=()=>{er=1;$("#pn").classList.remove("on");$("#er").classList.add("on")};

  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{d=1;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{
    if(!d)return;
    const[a,b]=pos(e);
    x.lineWidth=$("#pz").value;
    x.globalCompositeOperation=er?"destination-out":"source-over";
    x.strokeStyle=$("#pc").value;
    x.lineTo(a,b);x.stroke();x.beginPath();x.moveTo(a,b);
  };
  c.onpointerup=()=>d=0;

  $("#wb-postit").onclick=()=>{
    const note=document.createElement("div");
    note.style.cssText="position:absolute;left:64px;top:64px;width:180px;min-height:105px;padding:10px 24px 10px 10px;background:var(--pi);color:#2f2e22;border-radius:4px;box-shadow:0 3px 8px #0002;cursor:grab;z-index:3;white-space:pre-wrap";
    note.innerHTML=`<button type="button" class="x">×</button><div contenteditable="true" style="outline:none;min-height:68px">Post-it</div>`;
    makeDraggable(note,bd);
    note.querySelector(".x").onclick=()=>note.remove();
    bd.appendChild(note);
  };

  const addBoardText=()=>{
    const txt=$("#wb-txt-in").value.trim();if(!txt)return;
    x.save();
    x.globalCompositeOperation="source-over";
    x.fillStyle=$("#pc").value;
    x.font="600 18px 'Plus Jakarta Sans',system-ui,sans-serif";
    x.fillText(txt,40,60);
    x.restore();
    $("#wb-txt-in").value="";
    $("#wb-txt-in").focus();
  };
  $("#wb-txt-btn").onclick=addBoardText;
  $("#wb-txt-in").onkeydown=e=>e.key=="Enter"&&addBoardText();

  $("#wc").onclick=()=>{
    x.clearRect(0,0,c.width,c.height);
    bd.querySelectorAll(".wb-floating").forEach(el=>el.remove());
  };

  $("#img-upload").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const wrap=document.createElement("div");
      wrap.className="wb-floating";
      wrap.style.cssText="position:absolute;left:40px;top:40px;max-width:260px;cursor:grab;z-index:2;border:1px solid var(--ln);border-radius:6px;background:var(--s);padding:4px;box-shadow:0 2px 6px #0002";
      wrap.innerHTML=`<button type="button" class="x">×</button><img src="${reader.result}" alt="${esc(f.name)}" style="display:block;max-width:100%;max-height:200px;border-radius:4px;pointer-events:none">`;
      makeDraggable(wrap,bd);
      wrap.querySelector(".x").onclick=()=>wrap.remove();
      bd.appendChild(wrap);
      $("#wb-status").textContent=f.name;
    };
    reader.readAsDataURL(f);
  };
}

let pt=0,left=1500;
$("#ps").onclick=()=>{
  if(pt){clearInterval(pt);pt=0;return}
  pt=setInterval(()=>{if(--left<=0){clearInterval(pt);pt=0;left=(+($("#fm").value||25))*60}$("#clk").textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60|0).padStart(2,"0")},1000);
};
$("#pr").onclick=()=>{clearInterval(pt);pt=0;left=(+($("#fm").value||25))*60;$("#clk").textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60|0).padStart(2,"0")};

$("#ta").onclick=()=>{
  const title=$("#tk").value.trim();if(!title)return;
  S.tasks.push({id:String(Date.now()),t:title,sub:$("#ts").value||S.sub,due:$("#td").value||"",done:false});
  $("#tk").value="";save();cal();home();$("#tk").focus();
};
$("#tk").onkeydown=e=>e.key=="Enter"&&$("#ta").click();

function cal(){
  const today=new Date().toISOString().slice(0,10);
  const cols=S.subs.length?S.subs:[{id:null,name:"General",color:"#4F7260"}];
  $("#bo").innerHTML=cols.map(sb=>{
    const items=S.tasks
      .filter(x=>x.sub==sb.id)
      .sort((a,b)=>(a.due||"9999-99-99").localeCompare(b.due||"9999-99-99"));
    return `
      <div class="col" style="border-top:3px solid ${sb.color}">
        <h5><b>${esc(sb.name)}</b><small>${items.length}</small></h5>
        ${items.map(x=>{
          const isUrgent=!x.done&&x.due&&x.due<=today;
          return `
            <div class="tc ${x.done?"dn":""} ${isUrgent?"urgent":""}">
              <input type="checkbox" ${x.done?"checked":""} onchange="toggleT('${x.id}')">
              <div><b>${esc(x.t)}</b><br><small>${esc(x.due||"—")}</small></div>
            </div>`;
        }).join("")||`<small class="mut">${esc(t("no_tasks"))}</small>`}
      </div>`;
  }).join("");
}
window.toggleT=id=>{
  const item=S.tasks.find(x=>x.id==id);
  if(item){item.done=!item.done;save();cal();home()}
};

function preview(){
  const sb=S.subs.find(x=>x.id==$("#xs").value);
  if(!sb){$("#xv").textContent="";return}
  const docs=S.docs.filter(d=>d.sub==sb.id);
  const docIds=new Set(docs.map(d=>String(d.id)));
  const relNotes=S.notes.filter(n=>n.doc&&docIds.has(String(n.doc)));

  const out=[
    "========================================",
    "WEBOOK - APUNTES Y NOTAS",
    "========================================",
    `Materia: ${sb.name}`,
    ""
  ];

  out.push("APUNTES / UNIDADES");
  if(!docs.length){
    out.push("Sin apuntes en esta materia.");
  }else{
    docs.forEach((d,i)=>{
      out.push(`\n${i+1}. ${d.name}`);
      out.push((d.text||"").trim());
    });
  }

  const nts=relNotes.filter(n=>n.kind!=="voice");
  const vcs=relNotes.filter(n=>n.kind==="voice");

  out.push("\nNOTAS Y POST-ITS");
  if(!nts.length) out.push("Sin notas ni post-its.");
  else nts.forEach(n=>out.push(`• [${n.kind=="pi"?"Post-it":"Nota"}] ${n.txt}`));

  out.push("\nAUDIOS");
  if(!vcs.length) out.push("Sin grabaciones de voz.");
  else vcs.forEach(v=>out.push(`• ${v.title||"Audio"} (${v.duration||"00:00"})`));

  $("#xv").textContent=out.join("\n");
}
$("#xs").onchange=preview;
$("#xt").onclick=()=>{
  const blob=new Blob([$("#xv").textContent||""],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="webook-apuntes.txt";a.click();
};

$("#auth").onsubmit=e=>{e.preventDefault();$("#auth").hidden=true;$("#app").hidden=false;drawAll()};
$("#out").onclick=()=>{$("#app").hidden=true;$("#auth").hidden=false};

applyLang();
</script>
