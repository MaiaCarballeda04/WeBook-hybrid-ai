<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
try{document.documentElement.dataset.theme=localStorage.wbt||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}
</script>
<title>WeBook</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{color-scheme:light;--bg:#F4F1EA;--s:#FBF9F3;--ink:#3b403c;--mut:#6f766f;--ac:#4F7260;--acf:#F8F6EC;--ln:#DDD8CB;--hl:#F1E2A6;--pi:#F5E59B;--in:#FFFDF8;--mgb:#EDEADF;--colb:#EFEBE0}
[data-theme=dark]{color-scheme:dark;--bg:#171B1F;--s:#1F2428;--ink:#DDE2DC;--mut:#97A29A;--ac:#86B596;--acf:#13201A;--ln:#2F363C;--hl:#6b6633;--pi:#D8CC87;--in:#252B30;--mgb:#232A27;--colb:#1B2024}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
b,strong,h1,h2,h3,h4,h5{font-weight:600}button{font-weight:500}
button,select,input,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--ln);background:var(--s);border-radius:6px;cursor:pointer;min-height:38px}
button.p,button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
input,select,textarea{padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--in)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
small,.mut{color:var(--mut)}

#auth{max-width:380px;margin:10vh auto;display:grid;gap:10px}
.fd{display:grid;gap:4px}

#app{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}
#wrap{min-width:0}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:14px 10px;background:var(--s);border-right:1px solid var(--ln)}
#side .brand{margin:4px 6px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
#side .brand img{width:28px;height:28px;object-fit:contain;border-radius:4px}
#side .nav{display:flex;flex-direction:column;gap:4px;flex:1}
#side .nav button{display:flex;align-items:center;gap:10px;text-align:left;border-color:transparent;background:none;width:100%}
#side .nav button.on{background:var(--ac);color:var(--acf)}
.ic{width:20px;text-align:center;flex:none}

header{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font:600 20px 'Plus Jakarta Sans',system-ui,sans-serif;margin-right:auto}
main{padding:16px;max-width:1200px;margin:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn-label{cursor:pointer;padding:7px 12px;border-radius:6px;background:var(--ac);color:var(--acf);display:inline-flex;align-items:center;min-height:38px;font-weight:500}

#rd{font:300 15px/1.75 'Plus Jakarta Sans',system-ui,sans-serif;min-height:160px;max-height:340px;overflow:auto;white-space:pre-wrap;background:var(--in);padding:12px;border:1px solid var(--ln);border-radius:6px}
.mg{position:relative;border-left:3px solid var(--ac);padding:8px 26px 8px 10px;margin:8px 0;background:var(--mgb);border-radius:4px;white-space:pre-wrap}
.pi{position:relative;background:var(--pi);color:#2f2e22;padding:10px 26px 10px 12px;border-radius:4px;box-shadow:0 2px 6px #0002;margin:8px 0;white-space:pre-wrap}
.voice-card{position:relative;border-left:3px solid #8a6d1d;padding:8px 26px 8px 10px;margin:8px 0;background:var(--mgb);border-radius:4px}
.voice-title{font-weight:600;border:0;background:transparent;padding:2px 4px;border-bottom:1px dashed var(--ln);width:100%;max-width:210px;margin-bottom:4px}
.x{position:absolute;right:6px;top:4px;border:0;background:none;padding:2px 6px;min-height:auto;color:inherit}

#clk{font:300 44px 'Plus Jakarta Sans',system-ui,sans-serif}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day-col{background:var(--colb);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:190px;display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:6px;font-size:13px}
.tc{background:var(--s);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:8px;padding:8px;font-size:13px;display:grid;gap:6px}
.tc.urgent{border-left-color:#b84a39}
.tc.dn{opacity:.55}
.tc.dn .t-title{text-decoration:line-through}
.tc-top{display:flex;gap:6px;align-items:flex-start}
.tc-actions{display:flex;gap:6px;flex-wrap:wrap}
.tc-actions button{min-height:28px;padding:2px 8px;font-size:12px}

@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ln)}
  #side .nav{flex-direction:row;overflow-x:auto}
}
</style>
</head>
<body>

<form id="auth" class="card" novalidate>
 <div class="brand" style="display:flex;align-items:center;gap:8px;">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="WeBook">
   WeBook
 </div>
 <label class="fd"><small data-l="email"></small><input id="em" type="email" data-p="email_p" autocomplete="email"></label>
 <label class="fd"><small data-l="pass"></small><input id="pw" type="password" data-p="pass_p" autocomplete="current-password"></label>
 <div class="row" style="margin-top:8px">
   <button type="submit" class="p" data-l="in"></button>
   <select class="lg" aria-label="Language"></select>
   <button type="button" class="th" aria-label="Theme">☾</button>
 </div>
</form>

<div id="app" hidden>
<aside id="side" aria-label="Menu">
 <div class="brand">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="WeBook">
   <span>WeBook</span>
 </div>
 <nav class="nav">
   <button type="button" data-v="home" class="on"><span class="ic">⌂</span><span data-l="home"></span></button>
   <button type="button" data-v="nb"><span class="ic">❏</span><span data-l="nb"></span></button>
   <button type="button" data-v="plans2d"><span class="ic">◈</span><span data-l="plans2d"></span></button>
   <button type="button" data-v="wb"><span class="ic">✎</span><span data-l="wb"></span></button>
   <button type="button" data-v="ex"><span class="ic">✦</span><span data-l="ex"></span></button>
   <button type="button" data-v="plan"><span class="ic">▦</span><span data-l="plan"></span></button>
   <button type="button" data-v="dl"><span class="ic">⇩</span><span data-l="dl"></span></button>
 </nav>
</aside>

<div id="wrap">
<header>
 <span class="brand" data-l="app_title"></span>
 <input id="api-key-in" type="password" size="22" autocomplete="off" placeholder="Gemini API Key (opcional)...">
 <select class="lg" aria-label="Language"></select>
 <button type="button" class="th" aria-label="Theme">☾</button>
 <button id="out" type="button" data-l="out"></button>
</header>

<main>
<div class="card row" id="sbar">
  <b data-l="subj"></b>
  <select id="sbs" aria-label="Subject"></select>
  <span style="flex:1"></span>
  <input id="sn" size="18" autocomplete="off" data-p="newsub_p">
  <button id="sa" type="button" class="p" data-l="newsub"></button>
</div>

<!-- INICIO -->
<section class="v" id="v-home">
 <div class="cols">
   <div>
     <div class="card"><h2 style="margin:0 0 4px" id="hi"></h2><small data-l="hint"></small></div>
     <div class="card">
       <b data-l="quick"></b>
       <div id="qc" style="max-height:260px;overflow:auto;margin:8px 0"></div>
       <div class="row">
         <input id="qi" style="flex:1" autocomplete="off" data-p="q_p">
         <button id="qs" type="button" class="p" data-l="ask"></button>
       </div>
     </div>
   </div>
   <aside>
     <div class="card"><b data-l="subs"></b><div id="hs" style="display:grid;gap:8px;margin-top:8px"></div></div>
     <div class="card"><b data-l="next"></b><div id="hn" style="margin-top:8px"></div></div>
   </aside>
 </div>
</section>

<!-- CUADERNO -->
<section class="v" id="v-nb" hidden>
 <div class="cols">
   <div>
     <div class="card">
       <div class="row">
         <label class="btn-label">
           <span data-l="file"></span><input id="uf" type="file" hidden accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,image/*">
         </label>
         <select id="ds" aria-label="Document"></select>
         <button id="sm" type="button" class="p" data-l="sum"></button>
         <button id="rec" type="button"><span data-l="rec"></span> <span id="rct">00:00</span></button>
         <small id="st" role="status"></small>
       </div>
       <div class="row">
         <input id="q" style="flex:1" autocomplete="off" data-p="qdoc_p">
         <button id="qa" type="button" class="p" data-l="ask_doc"></button>
       </div>
       <div id="ans" class="mg" hidden></div>
     </div>

     <div class="card">
       <div class="row">
         <input id="nt" size="24" autocomplete="off" data-p="note_p">
         <button id="mgn" type="button" data-l="add_note"></button>
         <button id="pit" type="button" class="p" data-l="add_postit"></button>
       </div>
       <div id="rd" tabindex="0"></div>
     </div>
   </div>

   <aside class="card">
     <b data-l="notes_feed"></b>
     <div id="nl" style="margin-top:8px"></div>
   </aside>
 </div>
</section>

<!-- ESQUEMAS Y MULTIMEDIA 2D -->
<section class="v" id="v-plans2d" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="plans2d"></h3>
   <p class="mut" data-l="plans2d_desc"></p>
   <div class="row">
     <label class="btn-label">
       <span data-l="upload_plan"></span><input id="mf" type="file" hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.mp4,.webm,image/*,video/*">
     </label>
   </div>
   <div id="plan-viewer" style="min-height:280px;border:1px solid var(--ln);border-radius:8px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:var(--in);padding:14px">
     <span class="mut" data-l="no_plan"></span>
   </div>
 </div>
</section>

<!-- PIZARRA (INTACTA EN SU ESTRUCTURA DE HERRAMIENTAS) -->
<section class="v" id="v-wb" hidden>
 <div class="card">
   <div class="row">
     <button id="pn" type="button" class="on" data-l="pen"></button>
     <button id="er" type="button" data-l="era"></button>
     <input id="pc" type="color" value="#4A6B5B" aria-label="Color">
     <input id="pz" type="range" min="1" max="20" value="3" aria-label="Size">
     <button id="wb-postit" type="button" data-l="board_postit"></button>
     <input id="wb-txt-in" size="16" autocomplete="off" data-p="board_txt_p">
     <button id="wb-txt-btn" type="button" data-l="board_txt_btn"></button>
     <label class="btn-label">
       <span data-l="up_img"></span><input id="img-upload" type="file" hidden accept="image/*">
     </label>
     <button id="wc" type="button" data-l="clr"></button>
     <small id="wb-status" class="mut"></small>
   </div>
   <div id="bd" style="position:relative;height:480px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fdfcea">
     <canvas id="wbc" style="position:absolute;inset:0;touch-action:none;cursor:crosshair;z-index:1"></canvas>
   </div>
 </div>
</section>

<!-- SIMULADOR DE EXÁMENES -->
<section class="v" id="v-ex" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="ex"></h3>
   <p class="mut" data-l="ex_desc"></p>
   <div class="row">
     <input id="exf" type="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,image/*" multiple>
     <button class="p" id="exg" type="button" data-l="gen"></button>
     <small id="exs" role="status"></small>
   </div>
 </div>
 <div id="eq"></div>
</section>

<!-- CALENDARIO SEMANAL & POMODORO -->
<section class="v" id="v-plan" hidden>
 <div class="card">
  <b data-l="pom"></b>
  <div class="row" style="margin-top:8px">
    <span data-l="foc"></span><input id="fm" type="number" min="1" value="25" style="width:70px">
    <span data-l="brk"></span><input id="bm" type="number" min="1" value="5" style="width:70px">
    <span id="pom-label" class="mut"></span>
  </div>
  <div class="row">
    <div id="clk">25:00</div>
    <button class="p" id="ps" type="button" data-l="start"></button>
    <button id="pr" type="button" data-l="reset"></button>
  </div>
 </div>

 <div class="card">
  <div class="row">
    <input id="tk" autocomplete="off" data-p="task_p" style="flex:1">
    <select id="ts" aria-label="Subject"></select>
    <input id="td" type="date">
    <button id="ta" type="button" class="p" data-l="add"></button>
  </div>
 </div>

 <div class="card">
  <div class="row" style="justify-content:space-between">
    <h3 style="margin:0" data-l="deadlines_title"></h3>
    <div class="row" style="margin:0">
      <button id="wk-prev" type="button">&lsaquo;</button>
      <b id="wk-range"></b>
      <button id="wk-next" type="button">&rsaquo;</button>
    </div>
  </div>
  <div id="bo" class="week-grid"></div>
 </div>
</section>

<!-- DESCARGAS -->
<section class="v" id="v-dl" hidden>
 <div class="card">
  <b data-l="dlc"></b>
  <div class="row" style="margin:10px 0">
    <select id="xs" style="flex:1"></select>
    <select id="x-order" aria-label="Order">
      <option value="topics_notes_audio_media">Orden: Temas → Notas → Audios → Esquemas/Videos</option>
      <option value="audio_notes_topics_media">Orden: Audios → Notas → Temas → Esquemas/Videos</option>
    </select>
    <button id="xt" type="button" class="p" data-l="txt"></button>
  </div>
  <div class="row" style="margin-bottom:12px">
    <label><input type="checkbox" id="inc-docs" checked> Apuntes y temas</label>
    <label><input type="checkbox" id="inc-notes" checked> Notas y Post-its</label>
    <label><input type="checkbox" id="inc-voices" checked> Audios</label>
    <label><input type="checkbox" id="inc-media" checked> Esquemas / Videos</label>
  </div>
  <div id="dl-media-links" class="row" style="margin-bottom:10px"></div>
  <pre id="xv" style="white-space:pre-wrap;max-height:380px;overflow:auto;background:var(--in);padding:12px;border-radius:6px"></pre>
 </div>
</section>

</main></div></div>

function fileToBase64Part(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const base64=String(reader.result||"").split(",")[1]||"";
      resolve({inlineData:{mimeType:file.type||"application/octet-stream",data:base64}});
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function extractPdfText(file){
  if(!window.pdfjsLib)return "";
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const pageText=tc.items.map(item=>item.str).join(" ").replace(/\s+/g," ").trim();
    if(pageText)pages.push(`--- Página ${p} ---\n${pageText}`);
  }
  return pages.join("\n\n").trim();
}

function detectSubjectDomain(text,fallback){
  const sb=S.subs.find(x=>String(x.id)===String(S.sub));
  const blob=`${sb?.name||""} ${fallback||""} ${text||""}`.toLowerCase();
  if(/matriz|matrices|determinante|vector|vectores|álgebra|algebra|rango|sistema|lineal/.test(blob))return "algebra";
  if(/derivada|integral|límite|limite|función|funcion|análisis|analisis|sucesión|sucesion/.test(blob))return "analisis";
  if(/fuerza|cinemática|cinematica|dinámica|dinamica|energía|energia|física|fisica|campo/.test(blob))return "fisica";
  return "general";
}

function buildEquivalentMockExam(text,label){
  const domain=detectSubjectDomain(text,label);
  if(domain==="algebra"){
    return [
      "1. Matrices y sistemas lineales\nSea A = [[2, 1, -1], [0, 3, 2], [1, -1, 4]] y b = [3, 5, 1]^T. Analiza la compatibilidad del sistema A·x = b y halla la solución.\nResolución paso a paso:\n- Calcula det(A): 2·(12+2) - 1·(0-2) + (-1)·(0-3) = 28 + 2 + 3 = 33 ≠ 0.\n- Como det(A) ≠ 0, el rango de A y de la ampliada es 3 (sistema compatible determinado).\n- Resuelve por sustitución o Gauss para obtener las tres componentes (x, y, z).",
      "2. Vectores en R³ (producto escalar, vectorial y proyección)\nDados u = (2, -1, 3) y v = (1, 4, -2), calcula u × v, el módulo |u × v| y la proyección ortogonal de u sobre v.\nResolución paso a paso:\n- u × v = ( (-1)(-2) - (3)(4), (3)(1) - (2)(-2), (2)(4) - (-1)(1) ) = (-10, 7, 9).\n- |u × v| = √((-10)² + 7² + 9²) = √(100 + 49 + 81) = √230.\n- proy_v(u) = ((u · v) / |v|²) · v, con u·v = 2 - 4 - 6 = -8 y |v|² = 1 + 16 + 4 = 21."
    ].join("\n\n");
  }
  if(domain==="analisis"){
    return [
      "1. Límites y continuidad\nAnaliza la continuidad en x = 2 y calcula lim_{x→2} (x² - 4) / (x - 2).\nResolución paso a paso:\n- Factoriza el numerador como diferencia de cuadrados: (x - 2)(x + 2).\n- Simplifica (x - 2) para x ≠ 2 y evalúa en x = 2: 2 + 2 = 4.\n- Indica el tipo de discontinuidad si la función original no estaba definida en x = 2.",
      "2. Derivadas y estudio de variación\nDada f(x) = x³ - 3x² + 2, determina intervalos de crecimiento/decrecimiento y extremos locales.\nResolución paso a paso:\n- Deriva: f'(x) = 3x² - 6x = 3x(x - 2).\n- Igualando a cero se obtienen puntos críticos en x = 0 y x = 2.\n- Analiza el signo de f'(x) en (-∞, 0), (0, 2) y (2, +∞)."
    ].join("\n\n");
  }
  if(domain==="fisica"){
    return [
      "1. Dinámica y leyes de Newton\nUn cuerpo de masa m = 4 kg asciende por un plano inclinado de 30° con rozamiento dinámico μ_k = 0,2. Plantea el diagrama de cuerpo libre y calcula la aceleración.\nResolución paso a paso:\n- Descompone el peso: P_x = m·g·sen(30°) y P_y = m·g·cos(30°).\n- Normal N = P_y y fricción f_k = μ_k·N.\n- Aplica ΣF_x = m·a para despejar a.",
      "2. Trabajo y conservación de la energía\nSi el cuerpo recorre d = 5 m sobre el plano, determina el trabajo neto y la velocidad final partiendo del reposo.\nResolución paso a paso:\n- Calcula W_neto = F_neta · d.\n- Usa ΔK = W_neto con K_i = 0 para hallar v_f = √(2·a·d)."
    ].join("\n\n");
  }
  const topic=(S.subs.find(x=>String(x.id)===String(S.sub))?.name)||"la unidad";
  return [
    `1. Ejercicio aplicado de ${topic}\nPlantea y resuelve un problema integrador sobre los conceptos centrales de ${topic} justificando cada paso.\nResolución paso a paso:\n- Identifica datos, variables y condiciones iniciales.\n- Selecciona la ley, definición o propiedad correspondiente.\n- Opera con orden y verifica coherencia del resultado.`,
    `2. Pregunta de análisis y justificación\nExplica cuándo se cumple la propiedad principal de ${topic} y muestra un contraejemplo donde no aplique.\nResolución paso a paso:\n- Enuncia la condición necesaria/suficiente.\n- Construye un caso concreto que cumpla y otro que falle.`
  ].join("\n\n");
}

function answerFromTextLocal(query,doc){
  const body=(doc?.content||"").trim();
  if(!body){
    const domain=detectSubjectDomain("",doc?.name||"");
    if(domain==="algebra")return "• Álgebra: revisa operaciones con matrices, determinantes, sistemas lineales y vectores en R²/R³ (módulo, producto escalar y producto vectorial).";
    return "Agrega una Gemini API Key arriba si quieres que el modelo lea directamente el contenido o la imagen de este archivo.";
  }
  const sentences=body.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
  const terms=query.toLowerCase().split(/\W+/).filter(w=>w.length>3);
  const scored=sentences.map(s=>{
    const sl=s.toLowerCase();
    const hits=terms.reduce((acc,w)=>acc+(sl.includes(w)?1:0),0);
    return{s,hits};
  }).filter(x=>x.hits>0).sort((a,b)=>b.hits-a.hits);

  if(scored.length){
    return scored.slice(0,5).map(x=>"• "+x.s).join("\n");
  }
  return sentences.slice(0,4).map(s=>"• "+s).join("\n");
}

async function generateWithGemini(parts,systemText=""){
  const apiKey=(localStorage.webook_gemini_key||"").trim();
  if(!apiKey){
    throw new Error("NO_API_KEY");
  }
  const payload={contents:[{role:"user",parts}]};
  if(systemText)payload.systemInstruction={parts:[{text:systemText}]};
  const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok){
    throw new Error(data?.error?.message||`Error al consultar Gemini (${resp.status}).`);
  }
  const out=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("\n").trim();
  if(!out)throw new Error("Gemini no devolvió una respuesta.");
  return out;
}

function addAutoNotesFromText(doc,summaryOrTopicsText){
  const existing=new Set(S.notes.filter(n=>n.doc===doc.id).map(n=>n.text));
  const lines=summaryOrTopicsText.split("\n")
    .map(l=>l.replace(/^[-•*\d.)\s]+/,"").trim())
    .filter(l=>l.length>=10&&l.length<=160);
  let added=0;
  for(const ln of lines){
    if(!existing.has(ln)){
      S.notes.push({id:String(Date.now()+Math.random()),doc:doc.id,sub:doc.sub,kind:"note",text:ln,auto:true});
      existing.add(ln);
      added++;
    }
    if(added>=3)break;
  }
  save();
  renderNotesPanel(doc.id);
}

async function runDocAI(promptText,isSummary=false){
  const d=curDoc();
  if(!d){
    $("#ans").hidden=false;
    $("#ans").textContent="Sube o selecciona un archivo en el cuaderno primero.";
    return;
  }
  $("#ans").hidden=false;
  $("#ans").textContent="...";
  const parts=[];
  if(d.inlinePart)parts.push(d.inlinePart);
  if(d.content)parts.push(`Contenido del documento (${d.name}):\n${d.content.slice(0,15000)}`);
  parts.push(
    isSummary
      ? "Lista los temas principales del documento, resume cada tema en puntos claros y extrae 3 notas clave cortas."
      : `Responde estrictamente en base a este material (${d.name}). Pregunta: ${promptText}`
  );
  try{
    const out=await generateWithGemini(parts,`Responde en ${LN[L]} con precisión y sin relleno.`);
    d.lastAiOutput=out;
    addAutoNotesFromText(d,out);
    save();
    $("#ans").textContent=out;
  }catch(err){
    if(err.message==="NO_API_KEY"){
      const localOut=isSummary
        ? buildEquivalentMockExam(d.content,d.name)
        : answerFromTextLocal(promptText,d);
      d.lastAiOutput=localOut;
      addAutoNotesFromText(d,localOut);
      save();
      $("#ans").textContent=localOut;
    }else{
      $("#ans").textContent=err.message;
    }
  }
}

/* Grabadora de voz */
let mr,recT,sec=0,recStart=0;
$("#rec").onclick=async()=>{
  if(mr&&mr.state=="recording"){mr.stop();return}
  try{
    const strm=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(strm);
    const chunks=[];
    sec=0;recStart=Date.now();
    $("#st").textContent="";
    $("#rec").classList.add("on");
    $("#rct").textContent="00:00";
    recT=setInterval(()=>{sec++;$("#rct").textContent=fmtDur(sec)},1000);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=async()=>{
      clearInterval(recT);
      strm.getTracks().forEach(tr=>tr.stop());
      const elapsed=Math.max(1,Math.round((Date.now()-recStart)/1000));
      const durStr=fmtDur(Math.max(sec,elapsed));
      const blob=chunks.length?new Blob(chunks,{type:mr.mimeType||"audio/webm"}):null;
      const audioDataUrl=blob?await new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result||""));r.onerror=()=>res("");r.readAsDataURL(blob)}):"";
      const idx=S.voices.length+1;
      S.voices.push({
        id:String(Date.now()),
        doc:curDoc()?.id||null,
        sub:S.sub,
        title:`Audio ${idx}`,
        duration:durStr,
        audioDataUrl
      });
      save();
      renderNotesPanel(curDoc()?.id||null);
      $("#rec").classList.remove("on");
      $("#rct").textContent="00:00";
    };
    mr.start();
  }catch{
    clearInterval(recT);
    $("#rec").classList.remove("on");

/* Pizarra (sin tocar su estructura ni herramientas) */
function makeDraggable(el,container){
  let active=false,ox=0,oy=0;
  el.onpointerdown=e=>{
    if(e.target.closest(".x")||e.target.isContentEditable)return;
    active=true;
    const rect=container.getBoundingClientRect();
    ox=e.clientX-rect.left-el.offsetLeft;
    oy=e.clientY-rect.top-el.offsetTop;
    el.setPointerCapture(e.pointerId);
    el.style.cursor="grabbing";
  };
  el.onpointermove=e=>{
    if(!active)return;
    const rect=container.getBoundingClientRect();
    const nx=Math.max(0,Math.min(rect.width-el.offsetWidth,e.clientX-rect.left-ox));
    const ny=Math.max(0,Math.min(rect.height-el.offsetHeight,e.clientY-rect.top-oy));
    el.style.left=nx+"px";
    el.style.top=ny+"px";
  };
  el.onpointerup=()=>{active=false;el.style.cursor="grab"};
}

let wb;
function initWb(){
  if(wb)return;wb=1;
  const c=$("#wbc"),bd=$("#bd");
  c.width=bd.clientWidth;c.height=bd.clientHeight;
  const x=c.getContext("2d");let d=0,er=0;

  $("#pn").onclick=()=>{er=0;$("#er").classList.remove("on");$("#pn").classList.add("on")};
  $("#er").onclick=()=>{er=1;$("#pn").classList.remove("on");$("#er").classList.add("on")};

  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{d=1;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{
    if(!d)return;
    const[a,b]=pos(e);
    x.lineWidth=$("#pz").value;
    x.globalCompositeOperation=er?"destination-out":"source-over";
    x.strokeStyle=$("#pc").value;
    x.lineTo(a,b);x.stroke();x.beginPath();x.moveTo(a,b);
  };
  c.onpointerup=()=>d=0;

  $("#wb-postit").onclick=()=>{
    const note=document.createElement("div");
    note.style.cssText="position:absolute;left:64px;top:64px;width:180px;min-height:105px;padding:10px 24px 10px 10px;background:var(--pi);color:#2f2e22;border-radius:4px;box-shadow:0 3px 8px #0002;cursor:grab;z-index:3;white-space:pre-wrap";
    note.innerHTML=`<button type="button" class="x">×</button><div contenteditable="true" style="outline:none;min-height:68px">Post-it</div>`;
    makeDraggable(note,bd);
    note.querySelector(".x").onclick=()=>note.remove();
    bd.appendChild(note);
  };

  const addBoardText=()=>{
    const txt=$("#wb-txt-in").value.trim();if(!txt)return;
    x.save();
    x.globalCompositeOperation="source-over";
    x.fillStyle=$("#pc").value;
    x.font="600 18px 'Plus Jakarta Sans',system-ui,sans-serif";
    x.fillText(txt,40,60);
    x.restore();
    $("#wb-txt-in").value="";
    $("#wb-txt-in").focus();
  };
  $("#wb-txt-btn").onclick=addBoardText;
  $("#wb-txt-in").onkeydown=e=>e.key=="Enter"&&addBoardText();

  $("#wc").onclick=()=>{
    x.clearRect(0,0,c.width,c.height);
    bd.querySelectorAll(".wb-floating").forEach(el=>el.remove());
  };

  $("#img-upload").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const wrap=document.createElement("div");
      wrap.className="wb-floating";
      wrap.style.cssText="position:absolute;left:40px;top:40px;max-width:260px;cursor:grab;z-index:2;border:1px solid var(--ln);border-radius:6px;background:var(--s);padding:4px;box-shadow:0 2px 6px #0002";
      wrap.innerHTML=`<button type="button" class="x">×</button><img src="${reader.result}" alt="${esc(f.name)}" style="display:block;max-width:100%;max-height:200px;border-radius:4px;pointer-events:none">`;
      makeDraggable(wrap,bd);
      wrap.querySelector(".x").onclick=()=>wrap.remove();
      bd.appendChild(wrap);
      $("#wb-status").textContent=f.name;
    };
    reader.readAsDataURL(f);
  };
}

/* Simulador de Exámenes */
$("#exg").onclick=async()=>{
  const files=[...($("#exf").files||[])];
  const sb=S.subs.find(x=>String(x.id)===String(S.sub));
  const subDocs=S.docs.filter(d=>d.sub==S.sub);
  $("#exs").textContent="...";
  const parts=[];
  let extractedTexts=[];
  for(const f of files){
    const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
    const isText=f.type.startsWith("text/")||/\.(txt|md)$/i.test(f.name);
    if(isText){
      const txt=await f.text();
      extractedTexts.push(txt);
      parts.push(`Parcial (${f.name}):\n${txt.slice(0,12000)}`);
    }else if(isPdf){
      const txt=await extractPdfText(f);
      if(txt){
        extractedTexts.push(txt);
        parts.push(`Parcial (${f.name}):\n${txt.slice(0,12000)}`);
      }else{
        parts.push(await fileToBase64Part(f));
      }
    }else{
      parts.push(await fileToBase64Part(f));
    }
  }
  if(!files.length){
    subDocs.forEach(d=>{
      if(d.content){extractedTexts.push(d.content);parts.push(`Material (${d.name}):\n${d.content.slice(0,10000)}`)}
      if(d.inlinePart)parts.push(d.inlinePart);
    });
  }
  parts.push("Genera ejercicios equivalentes en dificultad a los parciales/temas subidos, con resolución paso a paso debajo de cada ejercicio.");
  const label=files.length?files.map(f=>f.name).join(", "):(sb?.name||"Simulacro");

  try{
    const raw=await generateWithGemini(parts,`Eres un profesor universitario. Responde en ${LN[L]}.`);
    S.exams.unshift({id:String(Date.now()),sub:S.sub,title:label,content:raw,answers:{}});
    save();$("#exs").textContent="";renderExams();
  }catch(err){
    if(err.message==="NO_API_KEY"){
      const mock=buildEquivalentMockExam(extractedTexts.join("\n"),label);
      S.exams.unshift({id:String(Date.now()),sub:S.sub,title:label,content:mock,answers:{}});
      save();$("#exs").textContent="";renderExams();
    }else{
      $("#exs").textContent=err.message;
    }
  }
};

function renderExams(){
  const list=S.exams.filter(e=>!S.sub||e.sub==S.sub);
  $("#eq").innerHTML=list.map(ex=>{
    const ansVal=ex.answers?.[0]||"";
    return `
      <div class="card" data-exam-id="${ex.id}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <b>${esc(ex.title)}</b>
          <button type="button" class="x" style="position:static" onclick="delExam('${ex.id}')">×</button>
        </div>
        <div style="white-space:pre-wrap;margin-bottom:10px">${esc(ex.content)}</div>
        <label class="fd">
          <small>Planteo / Respuesta del estudiante</small>
          <textarea rows="4" style="width:100%" oninput="onExamAnswer('${ex.id}',this.value)">${esc(ansVal)}</textarea>
        </label>
      </div>`;
  }).join("");
}

window.onExamAnswer=(examId,val)=>{
  const ex=S.exams.find(e=>String(e.id)===String(examId));
  if(ex){ex.answers=ex.answers||{};ex.answers[0]=val;save()}
};
window.delExam=id=>{
  S.exams=S.exams.filter(e=>String(e.id)!==String(id));
  save();renderExams();
};

/* Calendario Semanal & Pomodoro */
let pt=0,left=1500,weekOffset=0;
const fmtClock=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function resetPomodoro(){
  clearInterval(pt);pt=0;
  left=Math.max(60,(+($("#fm").value||25))*60);
  $("#clk").textContent=fmtClock(left);
}

$("#ps").onclick=()=>{
  if(pt){clearInterval(pt);pt=0;return}
  if(!left)resetPomodoro();
  pt=setInterval(()=>{
    if(--left<=0){
      clearInterval(pt);pt=0;
      left=(+($("#bm").value||5))*60;
      $("#pom-label").textContent="Break";
    }
    $("#clk").textContent=fmtClock(left);
  },1000);
};
$("#pr").onclick=resetPomodoro;
$("#fm").onchange=resetPomodoro;

window.startTaskPomodoro=title=>{
  $("#pom-label").textContent=title;
  resetPomodoro();
  $("#ps").click();
};

$("#ta").onclick=()=>{
  const title=$("#tk").value.trim();if(!title)return;
  const due=$("#td").value||new Date().toISOString().slice(0,10);
  S.tasks.push({id:String(Date.now()),title,sub:$("#ts").value||S.sub||null,due,done:false});
  $("#tk").value="";
  save();renderCalendar();home();$("#tk").focus();
};
$("#tk").onkeydown=e=>e.key=="Enter"&&$("#ta").click();

function getWeekDays(offset){
  const now=new Date();
  const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)+offset*7);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const label=d.toLocaleDateString(L,{weekday:"short",day:"numeric",month:"short"});
    return{iso,label};
  });
}

$("#wk-prev").onclick=()=>{weekOffset--;renderCalendar()};
$("#wk-next").onclick=()=>{weekOffset++;renderCalendar()};

function renderCalendar(){
  const days=getWeekDays(weekOffset);
  $("#wk-range").textContent=`${days[0].label} — ${days[6].label}`;
  const today=new Date().toISOString().slice(0,10);

  $("#bo").innerHTML=days.map(day=>{
    const items=S.tasks.filter(x=>x.due===day.iso);
    return `
      <div class="day-col">
        <div class="day-head"><b>${esc(day.label)}</b><small>${items.length}</small></div>
        ${items.map(x=>{
          const sb=S.subs.find(s=>String(s.id)===String(x.sub));
          const urgent=!x.done&&x.due<=today;
          return `
            <div class="tc ${x.done?"dn":""} ${urgent?"urgent":""}" style="border-left-color:${sb?sb.color:"var(--ac)"}">
              <div class="tc-top">
                <input type="checkbox" ${x.done?"checked":""} onchange="toggleTask('${x.id}')">
                <div class="t-title">
                  <b>${esc(x.title)}</b>
                  ${sb?`<br><small class="mut">${esc(sb.name)}</small>`:""}
                </div>
              </div>
              <div class="tc-actions">
                <button type="button" onclick="startTaskPomodoro('${esc(x.title)}')">Pomodoro</button>
                <button type="button" class="x" style="position:static" onclick="delTask('${x.id}')">×</button>
              </div>
            </div>`;
        }).join("")||`<small class="mut">${esc(t("no_tasks"))}</small>`}
      </div>`;
  }).join("");
}

window.toggleTask=id=>{
  const item=S.tasks.find(x=>String(x.id)===String(id));
  if(item){item.done=!item.done;save();renderCalendar();home()}
};
window.delTask=id=>{
  S.tasks=S.tasks.filter(x=>String(x.id)!==String(id));
  save();renderCalendar();home();
};

/* Descargas organizadas */
function buildExportData(subId){
  const sb=S.subs.find(x=>String(x.id)===String(subId));
  if(!sb)return{text:"",voices:[],plans:[]};

  const docs=S.docs.filter(d=>String(d.sub)===String(sb.id));
  const docIds=new Set(docs.map(d=>String(d.id)));
  const notes=S.notes.filter(n=>!n.doc||docIds.has(String(n.doc)));
  const voices=S.voices.filter(v=>!v.doc||docIds.has(String(v.doc))||String(v.sub)===String(sb.id));
  const plans=S.plans.filter(p=>!p.sub||String(p.sub)===String(sb.id));

  const sections={};

  if($("#inc-docs")?.checked){
    const arr=[
      "============================================================",
      "1. APUNTES Y TEMAS PRINCIPALES",
      "============================================================"
    ];
    if(!docs.length){
      arr.push("Sin apuntes cargados en esta materia.");
    }else{
      docs.forEach((d,idx)=>{
        arr.push(`\n[${idx+1}] ${d.name}`);
        const body=(d.content||"").trim();
        if(body)arr.push(body);
        if(d.lastAiOutput)arr.push("\nResumen / Respuesta IA:\n"+d.lastAiOutput);
      });
    }
    sections.topics=arr.join("\n");
  }

  if($("#inc-notes")?.checked){
    const arr=[
      "============================================================",
      "2. NOTAS Y POST-ITS",
      "============================================================"
    ];
    if(!notes.length){
      arr.push("Sin notas ni Post-its registrados.");
    }else{
      notes.forEach(n=>{
        const tag=n.kind==="postit"?"POST-IT":"NOTA";
        arr.push(`• [${tag}] ${n.text}`);
      });
    }
    sections.notes=arr.join("\n");
  }

  if($("#inc-voices")?.checked){
    const arr=[
      "============================================================",
      "3. GRABACIONES DE VOZ",
      "============================================================"
    ];
    if(!voices.length){
      arr.push("Sin grabaciones de voz guardadas.");
    }else{
      voices.forEach(v=>{
        arr.push(`• ${v.title} — Duración: ${v.duration}`);
      });
    }
    sections.audio=arr.join("\n");
  }

  if($("#inc-media")?.checked){
    const arr=[
      "============================================================",
      "4. ESQUEMAS 2D Y VIDEOS",
      "============================================================"
    ];
    if(!plans.length){
      arr.push("Sin esquemas ni videos guardados.");
    }else{
      plans.forEach(p=>{
        const kind=p.isVideo?"Video":(p.isImg?"Esquema/Imagen":"Archivo");
        arr.push(`• [${kind}] ${p.name}`);
      });
    }
    sections.media=arr.join("\n");
  }

  const orderMode=$("#x-order")?.value||"topics_notes_audio_media";
  const orderMap={
    topics_notes_audio_media:["topics","notes","audio","media"],
    audio_notes_topics_media:["audio","notes","topics","media"]
  }[orderMode]||["topics","notes","audio","media"];

  const header=[
    "************************************************************",
    `WEBOOK — MATERIA: ${sb.name.toUpperCase()}`,
    `Fecha: ${new Date().toLocaleDateString()}`,
    "************************************************************",
    ""
  ].join("\n");

  const bodyBlocks=orderMap.map(k=>sections[k]).filter(Boolean).join("\n\n");
  return{text:header+bodyBlocks,voices,plans};
}

function previewExport(){
  const res=buildExportData($("#xs").value);
  $("#xv").textContent=res.text;
  const mediaHtml=[
    ...res.voices.filter(v=>v.audioDataUrl).map(v=>`<a download="${esc(v.title)}.webm" href="${v.audioDataUrl}" class="btn-label" style="text-decoration:none">⬇ ${esc(v.title)} (${esc(v.duration)})</a>`),
    ...res.plans.filter(p=>p.src).map(p=>`<a download="${esc(p.name)}" href="${p.src}" class="btn-label" style="text-decoration:none">⬇ ${esc(p.name)}</a>`)
  ].join("");
  $("#dl-media-links").innerHTML=mediaHtml;
}

$("#xs").onchange=previewExport;
$("#x-order").onchange=previewExport;
["#inc-docs","#inc-notes","#inc-voices","#inc-media"].forEach(sel=>{
  $(sel).onchange=previewExport;
});

$("#xt").onclick=()=>{
  const content=$("#xv").textContent||buildExportData($("#xs").value).text;
  if(!content)return;
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="webook-material-ordenado.txt";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};
