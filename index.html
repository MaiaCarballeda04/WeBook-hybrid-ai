<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
try{document.documentElement.dataset.theme=localStorage.wbt||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}
</script>
<title>WeBook</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{color-scheme:light;--bg:#F4F1EA;--s:#FBF9F3;--ink:#3b403c;--mut:#6f766f;--ac:#4F7260;--acf:#F8F6EC;--ln:#DDD8CB;--hl:#F1E2A6;--pi:#F5E59B;--in:#FFFDF8;--mgb:#EDEADF;--colb:#EFEBE0}
[data-theme=dark]{color-scheme:dark;--bg:#171B1F;--s:#1F2428;--ink:#DDE2DC;--mut:#97A29A;--ac:#86B596;--acf:#13201A;--ln:#2F363C;--hl:#6b6633;--pi:#D8CC87;--in:#252B30;--mgb:#232A27;--colb:#1B2024}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
b,strong,h1,h2,h3,h4,h5{font-weight:600}button{font-weight:500}
button,select,input,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--ln);background:var(--s);border-radius:6px;cursor:pointer;min-height:38px}
button:hover{border-color:var(--ac)}
button.p,button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
input,select,textarea{padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--in)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
small,.mut{color:var(--mut)}

#auth{max-width:380px;margin:10vh auto;display:grid;gap:10px}
.fd{display:grid;gap:4px}

#app{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}
#wrap{min-width:0}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:14px 10px;background:var(--s);border-right:1px solid var(--ln)}
#side .brand{margin:4px 6px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
#side .brand img{width:28px;height:28px;object-fit:contain;border-radius:4px}
#side .nav{display:flex;flex-direction:column;gap:4px;flex:1}
#side .nav button{display:flex;align-items:center;gap:10px;text-align:left;border-color:transparent;background:none;width:100%}
#side .nav button.on{background:var(--ac);color:var(--acf)}
.ic{width:20px;text-align:center;flex:none}

header{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font:600 20px 'Plus Jakarta Sans',system-ui,sans-serif;margin-right:auto}
main{padding:16px;max-width:1200px;margin:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn-label{cursor:pointer;padding:7px 12px;border-radius:6px;background:var(--ac);color:var(--acf);display:inline-flex;align-items:center;min-height:38px;font-weight:500}

#rd{font:300 15px/1.75 'Plus Jakarta Sans',system-ui,sans-serif;min-height:160px;max-height:340px;overflow:auto;white-space:pre-wrap;background:var(--in);padding:12px;border:1px solid var(--ln);border-radius:6px}
.mg{position:relative;border-left:3px solid var(--ac);padding:8px 26px 8px 10px;margin:8px 0;background:var(--mgb);border-radius:4px;white-space:pre-wrap}
.pi{position:relative;background:var(--pi);color:#2f2e22;padding:10px 26px 10px 12px;border-radius:4px;box-shadow:0 2px 6px #0002;margin:8px 0;white-space:pre-wrap}
.voice-card{position:relative;border-left:3px solid #8a6d1d;padding:8px 26px 8px 10px;margin:8px 0;background:var(--mgb);border-radius:4px}
.voice-title{font-weight:600;border:0;background:transparent;padding:2px 4px;border-bottom:1px dashed var(--ln);width:100%;max-width:220px;margin-bottom:4px}
.x{position:absolute;right:6px;top:4px;border:0;background:none;padding:2px 6px;min-height:auto;color:inherit}

.anno-box{background:var(--mgb);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:12px;background:var(--mgb);border:1px solid var(--ln);font-weight:500}

#clk{font:300 44px 'Plus Jakarta Sans',system-ui,sans-serif}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day-col{background:var(--colb);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:190px;display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:6px;font-size:13px}
.tc{background:var(--s);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:8px;padding:8px;font-size:13px;display:grid;gap:6px}
.tc.urgent{border-left-color:#b84a39}
.tc.dn{opacity:.55}
.tc.dn .t-title{text-decoration:line-through}
.tc-top{display:flex;gap:6px;align-items:flex-start}
.tc-actions{display:flex;gap:6px;flex-wrap:wrap}
.tc-actions button{min-height:28px;padding:2px 8px;font-size:12px}

@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ln)}
  #side .nav{flex-direction:row;overflow-x:auto}
}
</style>
</head>
<body>

<form id="auth" class="card" novalidate>
 <div class="brand" style="display:flex;align-items:center;gap:8px;">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="WeBook">
   WeBook
 </div>
 <small class="mut" data-l="auth_hint"></small>
 <label class="fd"><small data-l="email"></small><input id="em" type="email" data-p="email_p" autocomplete="email"></label>
 <label class="fd"><small data-l="pass"></small><input id="pw" type="password" data-p="pass_p" autocomplete="current-password"></label>
 <div class="row" style="margin-top:8px">
   <button type="submit" class="p" data-l="in"></button>
   <select class="lg" aria-label="Language"></select>
   <button type="button" class="th" aria-label="Theme">☾</button>
 </div>
</form>

<div id="app" hidden>
<aside id="side" aria-label="Menu">
 <div class="brand">
   <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F7260'/><text x='50' y='62' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>" alt="WeBook">
   <span>WeBook</span>
 </div>
 <nav class="nav">
   <button type="button" data-v="home" class="on"><span class="ic">⌂</span><span data-l="home"></span></button>
   <button type="button" data-v="nb"><span class="ic">❏</span><span data-l="nb"></span></button>
   <button type="button" data-v="plans2d"><span class="ic">◈</span><span data-l="plans2d"></span></button>
   <button type="button" data-v="wb"><span class="ic">✎</span><span data-l="wb"></span></button>
   <button type="button" data-v="ex"><span class="ic">✦</span><span data-l="ex"></span></button>
   <button type="button" data-v="plan"><span class="ic">▦</span><span data-l="plan"></span></button>
   <button type="button" data-v="dl"><span class="ic">⇩</span><span data-l="dl"></span></button>
 </nav>
</aside>

<div id="wrap">
<header>
 <span class="brand" data-l="app_title"></span>
 <span class="badge" data-l="ready_badge"></span>
 <select class="lg" aria-label="Language"></select>
 <button type="button" class="th" aria-label="Theme">☾</button>
 <button id="out" type="button" data-l="out"></button>
</header>

<main>
<div class="card row" id="sbar">
  <b data-l="subj"></b>
  <select id="sbs" aria-label="Subject"></select>
  <span style="flex:1"></span>
  <input id="sn" size="18" autocomplete="off" data-p="newsub_p">
  <button id="sa" type="button" class="p" data-l="newsub"></button>
</div>

<!-- INICIO -->
<section class="v" id="v-home">
 <div class="cols">
   <div>
     <div class="card"><h2 style="margin:0 0 4px" id="hi"></h2><small data-l="hint"></small></div>
     <div class="card">
       <b data-l="quick"></b>
       <div id="qc" style="max-height:260px;overflow:auto;margin:8px 0"></div>
       <div class="row">
         <input id="qi" style="flex:1" autocomplete="off" data-p="q_p">
         <button id="qs" type="button" class="p" data-l="ask"></button>
       </div>
     </div>
   </div>
   <aside>
     <div class="card"><b data-l="subs"></b><div id="hs" style="display:grid;gap:8px;margin-top:8px"></div></div>
     <div class="card"><b data-l="next"></b><div id="hn" style="margin-top:8px"></div></div>
   </aside>
 </div>
</section>

<!-- CUADERNO -->
<section class="v" id="v-nb" hidden>
 <div class="cols">
   <div>
     <div class="card">
       <div class="row">
         <label class="btn-label">
           <span data-l="file"></span><input id="uf" type="file" hidden accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,image/*">
         </label>
         <select id="ds" aria-label="Document"></select>
         <button id="sm" type="button" class="p" data-l="sum"></button>
         <button id="rec" type="button"><span data-l="rec"></span> <span id="rct">00:00</span></button>
         <small id="st" role="status"></small>
       </div>
       <div class="row">
         <input id="q" style="flex:1" autocomplete="off" data-p="qdoc_p">
         <button id="qa" type="button" class="p" data-l="ask_doc"></button>
       </div>
       <div id="ans" class="mg" hidden></div>
     </div>

     <div class="card">
       <div class="row">
         <input id="nt" size="24" autocomplete="off" data-p="note_p">
         <button id="mgn" type="button" data-l="add_note"></button>
         <button id="pit" type="button" class="p" data-l="add_postit"></button>
       </div>
       <div id="rd" tabindex="0"></div>
     </div>
   </div>

   <aside class="card">
     <b data-l="notes_feed"></b>
     <div id="nl" style="margin-top:8px"></div>
   </aside>
 </div>
</section>

<!-- ESQUEMAS 2D/3D Y MULTIMEDIA -->
<section class="v" id="v-plans2d" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="plans2d"></h3>
   <p class="mut" data-l="plans2d_desc"></p>
   <div class="row">
     <label class="btn-label">
       <span data-l="upload_plan"></span><input id="mf" type="file" hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.mp4,.webm,image/*,video/*">
     </label>
     <input id="anno-measure" size="16" autocomplete="off" data-p="measure_p">
     <input id="anno-text" style="flex:1;min-width:180px" autocomplete="off" data-p="anno_p">
     <button id="anno-add" type="button" class="p" data-l="add_anno"></button>
   </div>
   <div id="plan-viewer" style="min-height:280px;border:1px solid var(--ln);border-radius:8px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:var(--in);padding:14px">
     <span class="mut" data-l="no_plan"></span>
   </div>
 </div>
</section>

<!-- PIZARRA (INTACTA EN SU ESTRUCTURA DE HERRAMIENTAS) -->
<section class="v" id="v-wb" hidden>
 <div class="card">
   <div class="row">
     <button id="pn" type="button" class="on" data-l="pen"></button>
     <button id="er" type="button" data-l="era"></button>
     <input id="pc" type="color" value="#4A6B5B" aria-label="Color">
     <input id="pz" type="range" min="1" max="20" value="3" aria-label="Size">
     <button id="wb-postit" type="button" data-l="board_postit"></button>
     <input id="wb-txt-in" size="16" autocomplete="off" data-p="board_txt_p">
     <button id="wb-txt-btn" type="button" data-l="board_txt_btn"></button>
     <label class="btn-label">
       <span data-l="up_img"></span><input id="img-upload" type="file" hidden accept="image/*">
     </label>
     <button id="wc" type="button" data-l="clr"></button>
     <small id="wb-status" class="mut"></small>
   </div>
   <div id="bd" style="position:relative;height:480px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fdfcea">
     <canvas id="wbc" style="position:absolute;inset:0;touch-action:none;cursor:crosshair;z-index:1"></canvas>
   </div>
 </div>
</section>

<!-- SIMULADOR DE EXÁMENES -->
<section class="v" id="v-ex" hidden>
 <div class="card">
   <h3 style="margin-top:0" data-l="ex"></h3>
   <p class="mut" data-l="ex_desc"></p>
   <div class="row">
     <input id="exf" type="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,image/*" multiple>
     <select id="ex-diff" aria-label="Difficulty">
       <option value="same" data-l="diff_same"></option>
       <option value="medium" data-l="diff_med"></option>
       <option value="hard" data-l="diff_hard"></option>
     </select>
     <button class="p" id="exg" type="button" data-l="gen"></button>
     <small id="exs" role="status"></small>
   </div>
 </div>
 <div id="eq"></div>
</section>

<!-- CALENDARIO SEMANAL & POMODORO -->
<section class="v" id="v-plan" hidden>
 <div class="card">
  <b data-l="pom"></b>
  <div class="row" style="margin-top:8px">
    <select id="pom-unit" aria-label="Unit">
      <option value="min" data-l="unit_min"></option>
      <option value="hr" data-l="unit_hr"></option>
    </select>
    <span data-l="foc"></span><input id="fm" type="number" min="1" value="25" style="width:74px">
    <span data-l="brk"></span><input id="bm" type="number" min="1" value="5" style="width:74px">
    <span id="pom-label" class="mut"></span>
  </div>
  <div class="row">
    <div id="clk">25:00</div>
    <button class="p" id="ps" type="button" data-l="start"></button>
    <button id="pr" type="button" data-l="reset"></button>
  </div>
 </div>

 <div class="card">
  <div class="row">
    <input id="tk" autocomplete="off" data-p="task_p" style="flex:1">
    <select id="tk-type" aria-label="Type">
      <option value="exam" data-l="t_exam"></option>
      <option value="delivery" data-l="t_delivery"></option>
      <option value="tp" data-l="t_tp"></option>
      <option value="study" data-l="t_study"></option>
    </select>
    <select id="ts" aria-label="Subject"></select>
    <input id="td" type="date">
    <button id="ta" type="button" class="p" data-l="add"></button>
  </div>
  <div id="study-guide" class="mg" style="margin-top:8px"></div>
 </div>

 <div class="card">
  <div class="row" style="justify-content:space-between">
    <h3 style="margin:0" data-l="deadlines_title"></h3>
    <div class="row" style="margin:0">
      <button id="wk-prev" type="button">&lsaquo;</button>
      <b id="wk-range"></b>
      <button id="wk-next" type="button">&rsaquo;</button>
    </div>
  </div>
  <div id="bo" class="week-grid"></div>
 </div>
</section>

<!-- DESCARGAS -->
<section class="v" id="v-dl" hidden>
 <div class="card">
  <b data-l="dlc"></b>
  <div class="row" style="margin:10px 0">
    <select id="xs" style="flex:1"></select>
    <select id="x-order" aria-label="Order">
      <option value="topics_notes_audio_media" data-l="ord_1"></option>
      <option value="audio_notes_topics_media" data-l="ord_2"></option>
    </select>
    <button id="xt" type="button" class="p" data-l="txt"></button>
    <button id="xdoc" type="button" data-l="doc"></button>
  </div>
  <div class="row" style="margin-bottom:12px">
    <label><input type="checkbox" id="inc-docs" checked> <span data-l="inc_docs"></span></label>
    <label><input type="checkbox" id="inc-notes" checked> <span data-l="inc_notes"></span></label>
    <label><input type="checkbox" id="inc-voices" checked> <span data-l="inc_voices"></span></label>
    <label><input type="checkbox" id="inc-media" checked> <span data-l="inc_media"></span></label>
  </div>
  <div id="dl-media-links" class="row" style="margin-bottom:10px"></div>
  <pre id="xv" style="white-space:pre-wrap;max-height:380px;overflow:auto;background:var(--in);padding:12px;border-radius:6px"></pre>
 </div>
</section>

</main></div></div>

async function extractPdfText(file){
  if(!window.pdfjsLib)return "";
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const pageText=tc.items.map(item=>item.str).join(" ").replace(/\s+/g," ").trim();
    if(pageText)pages.push(`--- Page ${p} ---\n${pageText}`);
  }
  return pages.join("\n\n").trim();
}

function detectSubjectDomain(text,fallback){
  const sb=S.subs.find(x=>String(x.id)===String(S.sub));
  const blob=`${sb?.name||""} ${fallback||""} ${text||""}`.toLowerCase();
  if(/matriz|matrices|determinante|vector|vectores|álgebra|algebra|rango|sistema|lineal/.test(blob))return "algebra";
  if(/derivada|integral|límite|limite|función|funcion|análisis|analisis|sucesión|sucesion|derivative|integral|limit/.test(blob))return "analisis";
  if(/fuerza|cinemática|cinematica|dinámica|dinamica|energía|energia|física|fisica|campo|force|motion|energy/.test(blob))return "fisica";
  if(/plano|sketchup|cota|medida|escala|2d|3d|pieza|diseño|diseno|arquitectura|mecánica|mecanica|scale|tolerance/.test(blob))return "design";
  return "general";
}

function extractKeyPhrases(text,limit=5){
  const clean=(text||"").replace(/\s+/g," ").trim();
  if(!clean)return[];
  const parts=clean.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>12);
  const scored=parts.map(s=>{
    const words=s.split(/\s+/).length;
    const score=(words>=6&&words<=32?2:1)+(/[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+/.test(s)?1:0);
    return{s,score};
  }).sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit).map(x=>x.s);
}

function buildDocSummaryLocal(doc){
  const body=(doc?.content||"").trim();
  const es=L==="es";
  if(!body){
    return es
      ? `Archivo cargado: ${doc?.name||"material"}. Ya podés agregar tus propias notas clave y Post-its a la derecha, o subir un archivo de texto / PDF con texto para resumir automáticamente.`
      : `Uploaded file: ${doc?.name||"material"}. You can add key notes and Post-its on the right, or upload a text file / text-based PDF for automatic summarization.`;
  }
  const keyPoints=extractKeyPhrases(body,5);
  const topics=keyPoints.slice(0,3).map((pt,i)=>`${i+1}. ${pt.slice(0,95)}${pt.length>95?"...":""}`).join("\n");
  const notes=keyPoints.map(pt=>"• "+pt).join("\n");
  return es
    ? `Temas principales (${doc.name}):\n${topics}\n\nResumen y notas clave:\n${notes}`
    : `Main topics (${doc.name}):\n${topics}\n\nSummary & key notes:\n${notes}`;
}

function answerFromTextLocal(query,doc,extraContext=""){
  const combined=[doc?.content||"",extraContext||""].filter(Boolean).join("\n\n").trim();
  const es=L==="es";
  if(!combined){
    return es
      ? "Aún no hay texto cargado en este material para responder. Subí un documento o agregá notas en el cuaderno."
      : "No text is loaded in this material yet. Upload a document or add notes in the notebook.";
  }
  const sentences=combined.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
  const terms=query.toLowerCase().split(/\W+/).filter(w=>w.length>2);
  const scored=sentences.map(s=>{
    const sl=s.toLowerCase();
    const hits=terms.reduce((acc,w)=>acc+(sl.includes(w)?1:0),0);
    return{s,hits};
  }).filter(x=>x.hits>0).sort((a,b)=>b.hits-a.hits);

  if(scored.length){
    const header=es?"Según tu material cargad0:":"Based on your uploaded material:";
    return header.replace("cargad0","cargado")+"\n"+scored.slice(0,5).map(x=>"• "+x.s).join("\n");
  }
  const fallbackHeader=es
    ?"No encontré coincidencia exacta con esa palabra en el texto, pero estos puntos clave del material se relacionan con el tema:"
    :"No exact keyword match was found in the text, but these key points from your material relate to the topic:";
  return fallbackHeader+"\n"+sentences.slice(0,4).map(s=>"• "+s).join("\n");
}

function buildEquivalentMockExam(text,label,diff="same"){
  const domain=detectSubjectDomain(text,label);
  const es=L==="es";
  const diffLabel=diff==="hard"
    ?(es?"Nivel exigente":"Challenge difficulty")
    :diff==="medium"
      ?(es?"Práctica intermedia":"Balanced difficulty")
      :(es?"Misma dificultad del parcial":"Equivalent exam difficulty");

  if(domain==="algebra"){
    return es
      ? `[${diffLabel}] 1. Multiple Choice — Matrices y determinantes\nDada A = [[2, 1, -1], [0, 3, 2], [1, -1, 4]], ¿cuál es det(A)?\nA) 25   B) 33   C) 19   D) 0\nPaso a paso: det(A) = 2·(12+2) - 1·(0-2) + (-1)·(0-3) = 28 + 2 + 3 = 33. Opción correcta: B.\n\n[${diffLabel}] 2. Ejercicio práctico — Vectores en R³\nDados u = (2, -1, 3) y v = (1, 4, -2), calcula u × v y su módulo.\nPaso a paso: u × v = (-10, 7, 9); |u × v| = √((-10)² + 7² + 9²) = √230.`
      : `[${diffLabel}] 1. Multiple Choice — Matrices & Determinants\nGiven A = [[2, 1, -1], [0, 3, 2], [1, -1, 4]], what is det(A)?\nA) 25   B) 33   C) 19   D) 0\nStep-by-step: det(A) = 2(12+2) - 1(0-2) + (-1)(0-3) = 28 + 2 + 3 = 33. Correct option: B.\n\n[${diffLabel}] 2. Practice Problem — Vectors in R³\nGiven u = (2, -1, 3) and v = (1, 4, -2), find u × v and its magnitude.\nStep-by-step: u × v = (-10, 7, 9); |u × v| = √((-10)² + 7² + 9²) = √230.`;
  }
  if(domain==="analisis"){
    return es
      ? `[${diffLabel}] 1. Multiple Choice — Límites\nCalcula lim_{x→2} (x² - 4) / (x - 2):\nA) 0   B) 2   C) 4   D) No existe\nPaso a paso: factorizá (x-2)(x+2)/(x-2) = x+2 y evaluá en x = 2 → 4. Opción correcta: C.\n\n[${diffLabel}] 2. Ejercicio práctico — Derivadas y extremos\nDada f(x) = x³ - 3x² + 2, hallá los puntos críticos y el crecimiento.\nPaso a paso: f'(x) = 3x(x - 2) = 0 → x = 0 y x = 2.`
      : `[${diffLabel}] 1. Multiple Choice — Limits\nEvaluate lim_{x→2} (x² - 4) / (x - 2):\nA) 0   B) 2   C) 4   D) Does not exist\nStep-by-step: Factor (x-2)(x+2)/(x-2) = x+2 and evaluate at x = 2 → 4. Correct option: C.\n\n[${diffLabel}] 2. Practice Problem — Derivatives & Extrema\nGiven f(x) = x³ - 3x² + 2, find critical points and monotonicity.\nStep-by-step: f'(x) = 3x(x - 2) = 0 → x = 0 and x = 2.`;
  }
  if(domain==="fisica"){
    return es
      ? `[${diffLabel}] 1. Multiple Choice — Plano inclinado\nEn un plano inclinado de 30°, la componente del peso paralela al plano es:\nA) m·g·cos(30°)   B) m·g·sen(30°)   C) m·g·tan(30°)   D) m·g\nPaso a paso: sobre el eje paralelo al plano actúa m·g·sen(θ). Opción correcta: B.\n\n[${diffLabel}] 2. Ejercicio práctico — Dinámica y trabajo\nUn cuerpo de 4 kg avanza 5 m en un plano con μ_k = 0,2. Planteá fuerzas y trabajo.\nPaso a paso: N = m·g·cos(30°), f_k = μ_k·N, F_neta = m·g·sen(30°) - f_k, W = F_neta·d.`
      : `[${diffLabel}] 1. Multiple Choice — Inclined Plane\nOn a 30° incline, the weight component parallel to the plane is:\nA) m·g·cos(30°)   B) m·g·sen(30°)   C) m·g·tan(30°)   D) m·g\nStep-by-step: Along the incline axis, gravity acts as m·g·sen(θ). Correct option: B.\n\n[${diffLabel}] 2. Practice Problem — Dynamics & Work\nA 4 kg block moves 5 m with μ_k = 0.2. Outline forces and net work.\nStep-by-step: N = m·g·cos(30°), f_k = μ_k·N, F_net = m·g·sen(30°) - f_k, W = F_net·d.`;
  }
  if(domain==="design"){
    return es
      ? `[${diffLabel}] 1. Multiple Choice — Escalas y medidas 2D/3D\nEn un plano a escala 1:50, un tramo de 120 mm en el dibujo equivale en realidad a:\nA) 2,4 mm   B) 120 mm   C) 6.000 mm   D) 500 mm\nPaso a paso: medida real = 120 mm × 50 = 6.000 mm. Opción correcta: C.\n\n[${diffLabel}] 2. Verificación 2D/3D — SketchUp y cotas\nIndicá qué medidas y tolerancias debés comprobar antes de validar la pieza.\nPaso a paso: revisá cotas principales, holguras y ejes de referencia.`
      : `[${diffLabel}] 1. Multiple Choice — 2D/3D Scale & Measurements\nAt a 1:50 scale, a 120 mm drawing segment equals in reality:\nA) 2.4 mm   B) 120 mm   C) 6,000 mm   D) 500 mm\nStep-by-step: Real size = 120 mm × 50 = 6,000 mm. Correct option: C.\n\n[${diffLabel}] 2. 2D/3D Check — SketchUp & Dimensions\nList key dimensions, clearances, and reference axes to verify on the piece.\nStep-by-step: Check main dimensions, fit tolerances, and datum axes.`;
  }
  const topic=(S.subs.find(x=>String(x.id)===String(S.sub))?.name)||label||(es?"la materia":"the subject");
  return es
    ? `[${diffLabel}] 1. Multiple Choice — Concepto clave de ${topic}\n¿Cuál es el mejor criterio al resolver un problema de ${topic}?\nA) Verificar condiciones y unidades antes de operar\nB) Omitir los datos iniciales\nC) Saltar pasos sin justificar\nD) Aplicar fórmulas sin revisar supuestos\nPaso a paso: siempre validá hipótesis, variables y unidades. Opción correcta: A.\n\n[${diffLabel}] 2. Problema equivalente de ${topic}\nResolvé un ejercicio integrador de ${topic} mostrando cada paso.\nPaso a paso: 1) Identificá datos; 2) Aplicá el método correspondiente; 3) Verificá el resultado.`
    : `[${diffLabel}] 1. Multiple Choice — Core Concept (${topic})\nWhat is the best practice when solving a ${topic} problem?\nA) Check conditions and units before calculating\nB) Ignore given constraints\nC) Skip steps without justification\nD) Apply formulas blindly\nStep-by-step: Always verify assumptions, variables, and units. Correct option: A.\n\n[${diffLabel}] 2. Equivalent Practice Problem (${topic})\nSolve a structured ${topic} problem showing every step.\nStep-by-step: 1) List given data; 2) Apply the rule/method; 3) Verify the result.`;
}

function addAutoNotesFromText(doc,summaryOrTopicsText){
  const existing=new Set(S.notes.filter(n=>n.doc===doc.id).map(n=>n.text));
  const lines=summaryOrTopicsText.split("\n")
    .map(l=>l.replace(/^[-•*\d.)\s]+/,"").trim())
    .filter(l=>l.length>=12&&l.length<=160&&!/^(temas principales|resumen y notas clave|main topics|summary & key notes)/i.test(l));
  let added=0;
  for(const ln of lines){
    if(!existing.has(ln)){
      S.notes.push({id:String(Date.now()+Math.random()),doc:doc.id,sub:doc.sub,kind:"note",text:ln,auto:true});
      existing.add(ln);
      added++;
    }
    if(added>=3)break;
  }
  save();
  renderNotesPanel(doc.id);
}

/* Grabadora de voz */
let mr,recT,sec=0,recStart=0;
$("#rec").onclick=async()=>{
  if(mr&&mr.state=="recording"){mr.stop();return}
  try{
    const strm=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(strm);
    const chunks=[];
    sec=0;recStart=Date.now();
    $("#st").textContent="";
    $("#rec").classList.add("on");
    $("#rct").textContent="00:00";
    recT=setInterval(()=>{sec++;$("#rct").textContent=fmtDur(sec)},1000);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=async()=>{
      clearInterval(recT);
      strm.getTracks().forEach(tr=>tr.stop());
      const elapsed=Math.max(1,Math.round((Date.now()-recStart)/1000));
      const durStr=fmtDur(Math.max(sec,elapsed));
      const blob=chunks.length?new Blob(chunks,{type:mr.mimeType||"audio/webm"}):null;
      const audioDataUrl=blob?await new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result||""));r.onerror=()=>res("");r.readAsDataURL(blob)}):"";
      const idx=S.voices.length+1;
      S.voices.push({
        id:String(Date.now()),
        doc:curDoc()?.id||null,
        sub:S.sub,
        title:`Voice Note ${idx}`,
        duration:durStr,
        audioDataUrl
      });
      save();
      renderNotesPanel(curDoc()?.id||null);
      $("#rec").classList.remove("on");
      $("#rct").textContent="00:00";
    };
    mr.start();
  }catch{
    clearInterval(recT);
    $("#rec").classList.remove("on");
    $("#rct").textContent="00:00";
    $("#st").textContent="Mic unavailable";
  }
};

/* Pizarra (sin tocar su estructura ni herramientas) */
function makeDraggable(el,container){
  let active=false,ox=0,oy=0;
  el.onpointerdown=e=>{
    if(e.target.closest(".x")||e.target.isContentEditable)return;
    active=true;
    const rect=container.getBoundingClientRect();
    ox=e.clientX-rect.left-el.offsetLeft;
    oy=e.clientY-rect.top-el.offsetTop;
    el.setPointerCapture(e.pointerId);
    el.style.cursor="grabbing";
  };
  el.onpointermove=e=>{
    if(!active)return;
    const rect=container.getBoundingClientRect();
    const nx=Math.max(0,Math.min(rect.width-el.offsetWidth,e.clientX-rect.left-ox));
    const ny=Math.max(0,Math.min(rect.height-el.offsetHeight,e.clientY-rect.top-oy));
    el.style.left=nx+"px";
    el.style.top=ny+"px";
  };
  el.onpointerup=()=>{active=false;el.style.cursor="grab"};
}

  $("#wc").onclick=()=>{
    x.clearRect(0,0,c.width,c.height);

  };

  $("#img-upload").onchange=e=>{
    const f=e.target.files[0];if(!f)return;

      const wrap=document.createElement("div");

/* Calendario Semanal con Prioridad y Plan Diario + Pomodoro Flexible */
let pt=0,left=1500,weekOffset=0;
const fmtClock=s=>{
  const n=Math.max(0,Math.floor(s));
  const h=Math.floor(n/3600);
  const m=Math.floor((n%3600)/60);
  const sec=n%60;
  return h>0
    ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
};

function getPomodoroSeconds(inputId,defaultVal){
  const raw=Math.max(1,+($(inputId)?.value||defaultVal));
  const unit=$("#pom-unit")?.value||"min";
  return unit==="hr"?raw*3600:raw*60;
}

function resetPomodoro(){
  clearInterval(pt);pt=0;
  left=getPomodoroSeconds("#fm",25);
  $("#clk").textContent=fmtClock(left);
}

$("#ps").onclick=()=>{
  if(pt){clearInterval(pt);pt=0;return}
  if(!left)resetPomodoro();
  pt=setInterval(()=>{
    if(--left<=0){
      clearInterval(pt);pt=0;
      left=getPomodoroSeconds("#bm",5);
      $("#pom-label").textContent=L==="es"?"Descanso":"Break";
    }
    $("#clk").textContent=fmtClock(left);
  },1000);
};
$("#pr").onclick=resetPomodoro;
$("#fm").onchange=resetPomodoro;
$("#pom-unit").onchange=resetPomodoro;

window.startTaskPomodoro=title=>{
  $("#pom-label").textContent=title;
  resetPomodoro();
  $("#ps").click();
};

const TYPE_WEIGHT={exam:1,delivery:2,tp:3,study:4};
function taskTypeLabel(kind){
  const map={exam:"t_exam",delivery:"t_delivery",tp:"t_tp",study:"t_study"};
  return t(map[kind]||"t_study");
}

function getPrioritizedTasks(){
  return [...S.tasks].sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    const d=(a.due||"9999-99-99").localeCompare(b.due||"9999-99-99");
    if(d!==0)return d;
    return (TYPE_WEIGHT[a.kind]||9)-(TYPE_WEIGHT[b.kind]||9);
  });
}

function renderStudyGuide(){
  const pending=getPrioritizedTasks().filter(x=>!x.done);
  if(!pending.length){
    $("#study-guide").textContent=L==="es"
      ?"Plan de estudio: agregá parciales, entregas o trabajos prácticos con fecha para ordenar prioridades y armar tu rutina diaria."
      :"Daily study plan: add midterms, deliveries, or practical works with dates to prioritize deadlines and plan daily study topics.";
    return;
  }
  const lines=pending.slice(0,4).map((x,idx)=>{
    const sb=S.subs.find(s=>String(s.id)===String(x.sub));
    const subjName=sb?sb.name:(L==="es"?"Materia general":"General");
    return L==="es"
      ? `${idx+1}. [${taskTypeLabel(x.kind)}] ${x.title} (${subjName} — fecha: ${x.due||"—"}) → Repasar conceptos clave y resolver 2 ejercicios hoy.`
      : `${idx+1}. [${taskTypeLabel(x.kind)}] ${x.title} (${subjName} — due: ${x.due||"—"}) → Review core topics and solve 2 practice items today.`;
  });
  $("#study-guide").textContent=lines.join("\n");
}

function getWeekDays(offset){
  const now=new Date();
  const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)+offset*7);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const label=d.toLocaleDateString(L,{weekday:"short",day:"numeric",month:"short"});
    return{iso,label};
  });
}

$("#wk-prev").onclick=()=>{weekOffset--;renderCalendar()};
$("#wk-next").onclick=()=>{weekOffset++;renderCalendar()};

function renderCalendar(){
  renderStudyGuide();
  const days=getWeekDays(weekOffset);
  $("#wk-range").textContent=`${days[0].label} — ${days[6].label}`;
  const today=new Date().toISOString().slice(0,10);

  $("#bo").innerHTML=days.map(day=>{
    const items=getPrioritizedTasks().filter(x=>x.due===day.iso);
    return `
      <div class="day-col">
        <div class="day-head"><b>${esc(day.label)}</b><small>${items.length}</small></div>
        ${items.map(x=>{
          const sb=S.subs.find(s=>String(s.id)===String(x.sub));
          const urgent=!x.done&&x.due<=today;
          return `
            <div class="tc ${x.done?"dn":""} ${urgent?"urgent":""}" style="border-left-color:${sb?sb.color:"var(--ac)"}">
              <div class="tc-top">
                <input type="checkbox" ${x.done?"checked":""} onchange="toggleTask('${x.id}')">
                <div class="t-title">
                  <b>${esc(x.title)}</b><br>
                  <span class="badge">${esc(taskTypeLabel(x.kind))}</span>
                  ${sb?`<br><small class="mut">${esc(sb.name)}</small>`:""}
                </div>
              </div>
              <div class="tc-actions">
                <button type="button" onclick="startTaskPomodoro('${esc(x.title)}')">Pomodoro</button>
                <button type="button" class="x" style="position:static" onclick="delTask('${x.id}')">×</button>
              </div>
            </div>`;
        }).join("")||`<small class="mut">${esc(t("no_tasks"))}</small>`}
      </div>`;
  }).join("");
}

  const item=S.tasks.find(x=>String(x.id)===String(id));
  if(item){item.done=!item.done;save();renderCalendar();home()}
};
window.delTask=id=>{
  S.tasks=S.tasks.filter(x=>String(x.id)!==String(id));
  save();renderCalendar();home();
};

/* Descargas organizadas (TXT + Word .doc + Audios y Esquemas) */
function buildExportData(subId){
  const sb=S.subs.find(x=>String(x.id)===String(subId));
  if(!sb)return{text:"",html:"",voices:[],plans:[],subjectName:"WeBook"};

  const docs=S.docs.filter(d=>String(d.sub)===String(sb.id));
  const docIds=new Set(docs.map(d=>String(d.id)));
  const notes=S.notes.filter(n=>!n.doc||docIds.has(String(n.doc)));
  const voices=S.voices.filter(v=>!v.doc||docIds.has(String(v.doc))||String(v.sub)===String(sb.id));
  const plans=S.plans.filter(p=>!p.sub||String(p.sub)===String(sb.id));

  const sections={};

  if($("#inc-docs")?.checked){
    const arr=[
      "============================================================",
      "1. TOPICS & NOTES / APUNTES Y TEMAS",
      "============================================================"
    ];
    if(!docs.length){
      arr.push("No documents loaded in this subject.");
    }else{
      docs.forEach((d,idx)=>{
        arr.push(`\n[${idx+1}] ${d.name}`);
        const body=(d.content||"").trim();
        if(body)arr.push(body);
        if(d.lastAiOutput)arr.push("\nSummary / Notes:\n"+d.lastAiOutput);
      });
    }
    sections.topics=arr.join("\n");
  }

  if($("#inc-notes")?.checked){
    const arr=[
      "============================================================",
      "2. NOTES & POST-ITS / NOTAS Y POST-ITS",
      "============================================================"
    ];
    if(!notes.length){
      arr.push("No notes or Post-its recorded.");
    }else{
      notes.forEach(n=>{
        const tag=n.kind==="postit"?"POST-IT":"NOTE";
        arr.push(`• [${tag}] ${n.text}`);
      });
    }
    sections.notes=arr.join("\n");
  }

  if($("#inc-voices")?.checked){
    const arr=[
      "============================================================",
      "3. VOICE RECORDINGS / GRABACIONES DE VOZ",
      "============================================================"
    ];
    if(!voices.length){
      arr.push("No voice recordings saved.");
    }else{
      voices.forEach(v=>{
        arr.push(`• ${v.title} — Duration: ${v.duration} (audio file downloadable below)`);
      });
    }
    sections.audio=arr.join("\n");
  }

  if($("#inc-media")?.checked){
    const arr=[
      "============================================================",
      "4. 2D/3D SCHEMES & VIDEOS / ESQUEMAS Y VIDEOS",
      "============================================================"
    ];
    if(!plans.length){
      arr.push("No 2D/3D schemes or videos saved.");
    }else{
      plans.forEach(p=>{
        const kind=p.isVideo?"Video":(p.isImg?"2D/3D Image":"File");
        const annos=(p.annos||[]).map(a=>`${a.measure||""} ${a.note||""}`.trim()).filter(Boolean).join(" | ");
        arr.push(`• [${kind}] ${p.name}${annos?` — Annotations: ${annos}`:""}`);
      });
    }
    sections.media=arr.join("\n");
  }

  const orderMode=$("#x-order")?.value||"topics_notes_audio_media";
  const orderMap={
    topics_notes_audio_media:["topics","notes","audio","media"],
    audio_notes_topics_media:["audio","notes","topics","media"]
  }[orderMode]||["topics","notes","audio","media"];

  const header=[
    "************************************************************",
    `WEBOOK — SUBJECT / MATERIA: ${sb.name.toUpperCase()}`,
    `Date: ${new Date().toLocaleDateString()}`,
    "************************************************************",
    ""
  ].join("\n");

  const bodyBlocks=orderMap.map(k=>sections[k]).filter(Boolean).join("\n\n");
  const fullText=header+bodyBlocks;
  const htmlDoc=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(sb.name)}</title><style>body{font-family:Calibri,Arial,sans-serif;line-height:1.5;color:#222;padding:24px}pre{white-space:pre-wrap;font-family:inherit}</style></head><body><pre>${esc(fullText)}</pre></body></html>`;
  return{text:fullText,html:htmlDoc,voices,plans,subjectName:sb.name};
}

function previewExport(){
  const res=buildExportData($("#xs").value);
  $("#xv").textContent=res.text;
  const mediaHtml=[
    ...res.voices.filter(v=>v.audioDataUrl).map(v=>`<a download="${esc(v.title)}.webm" href="${v.audioDataUrl}" class="btn-label" style="text-decoration:none">⬇ ${esc(v.title)} (${esc(v.duration)})</a>`),
    ...res.plans.filter(p=>p.src).map(p=>`<a download="${esc(p.name)}" href="${p.src}" class="btn-label" style="text-decoration:none">⬇ ${esc(p.name)}</a>`)
  ].join("");
  $("#dl-media-links").innerHTML=mediaHtml;
}

function triggerDownload(content,mime,filename){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

$("#xs").onchange=previewExport;
$("#x-order").onchange=previewExport;
["#inc-docs","#inc-notes","#inc-voices","#inc-media"].forEach(sel=>{
  $(sel).onchange=previewExport;
});

$("#xt").onclick=()=>{
  const res=buildExportData($("#xs").value);
  const content=$("#xv").textContent||res.text;
  if(!content)return;
  triggerDownload(content,"text/plain;charset=utf-8",`webook-${(res.subjectName||"study").toLowerCase().replace(/\s+/g,"-")}.txt`);
};

$("#xdoc").onclick=()=>{
  const res=buildExportData($("#xs").value);
  if(!res.html)return;
  triggerDownload(res.html,"application/msword;charset=utf-8",`webook-${(res.subjectName||"study").toLowerCase().replace(/\s+/g,"-")}.doc`);
};
